    extendedDescription: "Open Geo Cleveland cheret èssere una resursa pro chi sa gente potzat chistionare e cumpartzire connoschèntzias subra s'impreu de grupos de datos geogràficos lìberos, prus che totu OpenStreetMap, e de software geogràficu abertu chi gestit, modìficat e ammustrat datos geogràficos, e pro promòvere s'impreu issoro in su nord-est de s'Ohio. Semus fintzas una setzione de Maptime =)"
