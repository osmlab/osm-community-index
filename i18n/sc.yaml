  Nottingham-OSM-pub-meetup:
    name: Addòbiu mensile in su pub de sas East Midlands (Nottingham)
    description: Addòbiu sotziale pro sos mapadores e sos utentes de sas East Midlands
    extendedDescription: "Unu grupu si addòbiat dae martzu de su 2011, a su cumintzu in Nottingham, prus a reghente in Derby e, a bortas, in àteros logos de sas East Midlands. Sunt addòbios sotziales, ma sunt unu logu ideale pro bènnere a fàghere preguntas ispetzìficas subra OSM, siat de sa zona siat in generale. In sos meses de istiu de sòlitu faghimus pro un'ora unu pagu de cartografia lèbia a curtzu de su logu de s'addòbiu. Su grupu in generale tenet un'interessu ispetziale pro sa cartografia de sos deretos de passàgiu pùblicos e a bortas organizat addòbios de cartografia pro custu."
