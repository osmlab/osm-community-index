  al-maptime-tirana:
    name: Maptime Tirana
    description: 'Eventos sotziales pro fàghere mapas impare: sos printzipiantes sunt prus che bene bènnidos!'
    extendedDescription: "Maptime est un'ambiente abertu pro imparare, pro totu sos livellos e sos grados de connoschèntzia, cun un'agiudu didàticu pensadu a posta pro chie cumintzat. Maptime est flessìbile e istruturadu a su matessi tempus, e dat logu a letziones de cartografia, laboratòrios, progetos in cursu cun unu fine cumpartzidu e tempus de traballu individuale o in collaboratzione."
