    extendedDescription: "Auni·ti a sa comunidade pro ischire de prus subra OpenStreetMap, pro fàghere preguntas o pro partetzipare a sas riuniones nostras. Totus sunt bene bènnidos!"
  bd-facebook:
    extendedDescription: "Faghes mapas in Bangladesh? Tenes preguntas o cheres èssere in cuntatu cun sa comunidade de inoghe? Auni·ti a nois in {url}. Totus sunt bene bènnidos!"
  be-chapter:
    description: Agiudamus a fàghere crèschere e a megiorare OpenStreetMap in Bèlgiu.
    extendedDescription: "Si cheres agiudare a megiorare e a fàghere crèschere sa comunidade de sos mapadores in Bèlgiu, pro fàghere apassionare a sas mapas galu prus gente, OpenStreetMap Bèlgiu est su logu giustu pro tene!"
