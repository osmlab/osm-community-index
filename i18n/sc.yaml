  GeoPhilly:
    name: GeoPhilly
    description: Addòbiu pro sos apassionados de mapas de sa zona de Philadelphia
    extendedDescription: "GeoPhilly aunit programmadores, geògrafos, apassionados de datos, de còdighe abertu, de tecnologias tzìvicas e de mapas in s'amore cumpartzidu pro sas mapas e pro sas istòrias chi contant. Si impreas sas mapas in su traballu tuo o si cheres ebbia ischire de prus, custu est s'addòbiu pro tene! Sos eventos nostros cherent èssere abertos, amistosos, educativos e sotziales: dae sas oras de aperitivu a sas cunferèntzias lampu o finas a sos laboratòrios. Beni a creare cun nois una comunidade geogràfica diversa e chi dat ispiratzione in Philadelphia!"
