    description: Assòtziu Yer Çizenler - Mapas pro totus
    extendedDescription: "Yer Çizenler est un'ONG locale, parte de sa comunidade turca de OSM, chi cheret promòvere s'impreu de datos e de ainas geogràficas abertas in sa comunidade natzionale de sa cartografia."
  ym-AASTU:
    name: AASTU Youth Mappers
    description: Setzione de YouthMappers in s'Addis Ababa Science and Technology University
    extendedDescription: "S'Assòtziu de sos istudiantes de ingegneria geomàtica (AGES) cheret promòvere produtos e servìtzios GIS e formare sos istudiantes in s'impreu issoro. Non promovet sa sotzializatzione intre sos istudiantes e sos professionistas ebbia, ma frunit fintzas una prataforma pro cumpartzire ideas noas pro organizare eventos noos de GIS e de rilievu e formatzione in s'universidade."
  ym-Abia-State-University:
    name: AbsuMappersTeam
    description: Setzione de YouthMappers in s'Abia State University
    extendedDescription: "AbsuMappersTeam est un'iscuadra de voluntàrios apassionados de mapas chi impreant OpenStreetMap, sos GIS e àteras tecnologias geogràficas a còdighe abertu pro risòlvere problemas. Est dedicada a sa risposta a sos disastros cun OpenStreetMap. Est una prataforma professionale de acumpangiamentu e de crèschida pro chie tenet passione pro sos GIS e pro sa cartografia. Est una comunidade de voluntàrios pro sa creatzione de datos geogràficos, sa regorta de datos in su logu e sa cartografia. S'iscuadra est istada fundada dae Victor N. Sunday (su mèntore de s'iscuadra) e dae su professore J. U. Ogbonna, chi coordinat s'iscuadra e est su cussigeri de sa facultade. AbsuMappersTeam est parte de UniqueMappersTeam-Port Harcourt. S'iscuadra cheret sustènnere un'isvilupu sustenìbile cun sas tecnologias geogràficas."
  ym-African-Methodist-Episcopal-University:
    name: YouthMappers-AMEU
    description: Setzione de YouthMappers in s'African Methodist Episcopal University
  ym-Ahmadu-Bello-University:
    name: ABU Geomappers
    description: Setzione de YouthMappers in s'Ahmadu Bello University
    extendedDescription: "Semus unu grupu de mapadores umanitàrios ghiados dae sos datos, dedicados a frunire servìtzios umanitàrios pro rispòndere a sos disastros e pro nde ridùere sos efetos. Semus cuntentos de cuntribuire cun s'esperièntzia e cun sas connoschèntzias nostras faghende mapas e de agiudare a ispàrghere s'#OpenEvangelism cun sa formatzione e cun sa collaboratzione."
  ym-Ardhi-University:
    name: ARU Mapper
    description: Setzione de YouthMappers in s'Ardhi University
    extendedDescription: Comente futuros consulentes de datos geogràficos, chircamus de formare e de cussigiare sa sotziedade pro chi impreet sos datos ispatziales non comente positzione ebbia, ma fintzas comente aina pro leare detzisiones e pro prevìdere sos perìgulos e sos cambiamentos climàticos chi podent fàghere dannu a sa gente de oe o a sas generatziones benidoras.
  ym-Arizona-State-University-facebook:
    description: Setzione de YouthMappers in s'Arizona State University
  ym-Arizona-State-University-twitter:
    description: Setzione de YouthMappers in s'Arizona State University
  ym-Asian-University-for-Women:
    name: YouthMappers at AUW
    description: Setzione de YouthMappers in s'Asian University for Women
    extendedDescription: "S'Asian University for Women cheret laureare fèminas chi ant a èssere professionistas àbiles e innovativas, dirigentes dedicadas a su servìtziu in sas impresas e in sas comunidades in ue ant a traballare e a bìvere, e chi ant a promòvere sa cumprensione intre culturas e un'isvilupu umanu e econòmicu sustenìbile in Àsia e in totu su mundu."
  ym-Ball-State-University:
    name: Gamma Theta Upsilon - Iota Omega Chapter
    description: Setzione de YouthMappers in sa Ball State University
    extendedDescription: "Sa setzione nostra est ativa meda. Nos dedicamus prus che totu a eventos pro sa comunidade, a sa regorta de fundos e a visitas de istùdiu. Como semus chirchende de isvilupare àteras atividades ligadas a sa cartografia pro atirare àteros istudiantes de s'universidade chi podent èssere interessados a cuntribuire."
  ym-Busitema-University:
    name: Good Mappers
    description: Setzione de YouthMappers in sa Busitema University
    extendedDescription: Good Mappers est un'iscuadra de istudiantes de sa Busitema University. S'obietivu printzipale suo est de creare una comunidade de mapadores espertos chi potzant cuntribuire a sa mapa de su mundu.
  ym-California-University-of-Pennsylvania:
    name: CalU PA GIS Club
    description: Setzione de YouthMappers in sa California University of Pennsylvania
    extendedDescription: Sos istudiantes de GIS de sa Cal U imparant a aplicare sa teoria ispatziale a su mundu reale. Su cursu de làurea si cuntzentrat in sa geografia e fintzas in s'impreu de sos GIS in sa gestione de sas emergèntzias.
  ym-Central-Washington-University:
    name: Club de geografia
    description: Setzione de YouthMappers in sa Central Washington University
    extendedDescription: "S'obietivu nostru, faghende iscuadra cun YouthMappers, est de agiudare sas zonas chi tenent bisòngiu de cartografia umanitària. Gasi semus a su servìtziu de sos frades e de sas sorres nostras de totu su mundu e megioramus fintzas sas abilidades nostras de cartografia."
  ym-Clemson-University:
    name: Clemson Mappers
    description: Setzione de YouthMappers in sa Clemson University
    extendedDescription: "Sos istudiantes de Clemson sunt sustentos dae su Center for Geospatial Technologies, una comunidade multidisciplinare de professionistas de sas sièntzias geogràficas chi sustenet atividades de chirca, de insegnamentu e de divulgatzione cun tecnologias chi permitint de regòllere, de analizare e de aplicare datos geogràficos. Sos istudiantes ìntegrant sas tecnologias geogràficas in sas atividades de istùdiu issoro in totu sas disciplinas e creant cuntatos in totu su mundu."
  ym-Cornell-University:
    name: Sotziedade de cartografia
    description: Setzione de YouthMappers in sa Cornell University
    extendedDescription: "Sos istudiantes e sos dotzentes de Cornell impreant datos abertos e programmas a còdighe abertu pro afrontare isfidas a livellu locale, natzionale e mundiale. Gasi sighimus sos obietivos nostros acadèmicos e personales de isvilupare sas abilidades nostras in sos GIS e in s'alfabetizatzione ispatziale."
  ym-CURAT:
    name: YouthMappers CURAT
    description: "Setzione de YouthMappers in su Centre Universitaire de Recherche et d'Application en Télédétection (CURAT) de l'Université Felix Houphouet Boigny"
    extendedDescription: S'obietivu de sa setzione nostra est de promòvere sa cartografia lìbera e collaborativa e s'impreu de sos datos de OpenStreetMap in su campu de sa chirca, e s'aplicatzione issoro pro creare ainas pro leare detzisiones. Agiudamus sos istudiantes a produire sos datos de sas chircas issoro.
  ym-Cuttington-University:
    name: Cuttington University YouthMappers
    description: Setzione de YouthMappers in sa Cuttington University
    extendedDescription: "Sos YouthMappers de sa Cuttington University, in Suakoko, in sa contea de Bong, sunt istudiantes de tres dipartimentos diferentes: su Dipartimentu de gestione de sas resursas naturales («DONRM»), su Dipartimentu de sièntzias ambientales e su Dipartimentu de sièntzias naturales. Dae cando est nàschida sa setzione, in freàrgiu de su 2017, sos membros sunt in totu 20 istudiantes, 5 pro onni dipartimentu."
  ym-Dedan-Kimathi-University-of-Technology:
    name: GDEV
    description: Setzione de YouthMappers in sa Dedan Kimathi University of Technology
    extendedDescription: "GDEV est unu grupu de apassionados de GIS de sa DeKUT chi cheret agiudare sos istudiantes a cumpartzire, a partetzipare e a imparare s'unu dae s'àteru in su campu de sos datos geogràficos."
  ym-Dhaka-College:
    name: YouthMappers Daka College
    description: Setzione de YouthMappers in su Dhaka College
    extendedDescription: "YouthMappers Dhaka College est un'initziativa de sos istudiantes pro agiudare a pònnere in sa mapa sas zonas prus fràgiles de su mundu, comente parte de s'atzione umanitària. YouthMappers dat a sos istudiantes s'oportunidade de agiudare sa gente e de impreare sa cartografia pro fines umanitàrios. Custos datos geogràficos abertos si podent impreare pro s'educatzione, pro sa navigatzione e pro àteros fines umanitàrios. Bonu traballu cun sas mapas!"
  ym-Dhaka-University:
    name: Openstreetmap YouthMappers
    description: Setzione de YouthMappers in sa Dhaka University
    extendedDescription: "Pro sos istudiantes de s'University of Dhaka est unu privilègiu mannu a fàghere mapas pro fines umanitàrios. Sa setzione nostra dat a sos istudiantes s'oportunidade de agiudare sa gente e de impreare sa cartografia pro fines umanitàrios."
  ym-Eastern-University:
    name: YouthMappers at Eastern University
    description: Setzione de YouthMappers in s'Eastern University
    extendedDescription: "YouthMappers at Eastern University, in Bangladesh, est nàschidu pro agiudare sa gente in sas crisis umanitàrias. Sos istudiantes, che a sos àteros mapadores de su mundu, si sunt impignados a agiudare sa gente a impreare sa mapa pro s'educatzione, pro sa navigatzione e pro àteros fines umanitàrios."
  ym-Far-Eastern-University-Institute-of-Technology:
    name: Junior Philippines Computer Society
    description: Setzione de YouthMappers in sa Far Eastern University -Institute of Technology
    extendedDescription: Sa FEU est reconnota comente una de sas universidades prus importantes de sas Filipinas. Sa missione sua est de formare laureados chi cuntribuant a su progressu de su paisu. S'universidade si ponet semper obietivos de etzellèntzia prus artos pro èssere intre sas mègius no in sas Filipinas ebbia, ma fintzas in totu su Sud-est asiàticu.
  ym-Federal-School-of-Surveys:
    name: OyoMappersTeam (OMT) Oyo
    description: Setzione de YouthMappers in sa Federal School of Surveys
  ym-Fourah-Bay-College:
    name: "Assòtziu geogràficu de sos istudiantes"
    description: Setzione de YouthMappers in su Fourah Bay College
    extendedDescription: "S'Assòtziu geogràficu de sos istudiantes - YouthMappers est un'assòtziu de istudiantes de su Fourah Bay College cun s'obietivu comunu de pònnere in sa mapa sos logos prus fràgiles de sa Sierra Leone e de totu su mundu pro dare agiudu e pro àteros fines de utilidade, e de fàghere chircas e àteras atividades educativas. Sa setzione est fata de giòvanos cun ideas mannas, cuntzentrados in s'isvilupu, cun sa capatzidade de traballare impare, de cumprèndere e de realizare comente iscuadra progetos de isvilupu sustenìbile."
  ym-George-Mason-University:
    name: Mason Mappers
    description: Setzione de YouthMappers in sa George Mason University
    extendedDescription: "Mason Mappers Student Society est un'organizatzione de istudiantes de cartografia umanitària de su Dipartimentu GGS de sa George Mason University. S'obietivu suo est de promòvere s'educatzione e sa connoschèntzia de sas tecnologias geogràficas e de sas sièntzias de s'informatzione geogràfica, de favorèssere una bona cura de su mundu e de crèschere in su campu professionale, creende una comunidade geogràfica positiva e interativa, e de formare sos istudiantes pro chi siant sos dirigentes de cras."
  ym-Grand-Gedeh-County-Community-College:
    name: YouthMappers at Grand Gedeh County Community College
    description: Setzione de YouthMappers in su Grand Gedeh County Community College
    extendedDescription: S'ùnicu obietivu de sos YouthMappers de su GGCCC est de pònnere in sa mapa sos logos de sa Libèria e de sas zonas de inghìriu chi galu non sunt in sa mapa. Aunimus sos giòvanos de su Grand Gedeh County Community College pro chi si leent s'impignu de traballare impare e de fàghere connòschere custos logos dae su puntu de vista geogràficu.
  ym-Gujarat-University:
    name: CCIM at Ahmedabad
    description: Setzione de YouthMappers in sa Gujarat University
  ym-Gulu-University:
    name: CSGU Mappers
    description: Setzione de YouthMappers in sa Gulu University
    extendedDescription: "Sos CSGU Mappers sunt sa Computing Society de sa Gulu University. Custa setzione est creativa, apassionada, innovativa e pronta a pònnere in sa mapa s'Uganda e totu su mundu, prus a largu de su chi sos àteros si podent immaginare."
  ym-Ignatius-Ajuru-University-of-Education:
    name: IgnatiusMappersTeam (IMT)
    description: Setzione de YouthMappers in s'Ignatius Ajuru University of Education
    extendedDescription: Semus una setzione de YouthMappers de s'Ignatius Ajuru University of Education e traballamus in sa cartografia collaborativa de s'ambiente nostru e in sa cartografia dae tesu de comunidades resistentes. Semus un'iscuadra de voluntàrios chi impreant OpenStreetMap e àteras fontes geogràficas abertas pro fàghere mapas.
  ym-Indiana-University-of-Pennsylvania:
    name: Club de sièntzias geogràficas
    description: Setzione de YouthMappers in s'Indiana University of Pennsylvania
  ym-Insititue-d-Enseignement-Superieur-de-Ruhengeri:
    name: YouthMappers at INES Ruhengeri
    description: "Setzione de YouthMappers in s'Insititue d' Enseignement Superieur de Ruhengeri"
    extendedDescription: Semus istudiantes de sos dipartimentos de Amministratzione e gestione de sas terras e de Rilievu topogràficu de s'INES-Ruhengeri. Faghimus atividades de cartografia chi portant cambiamentos cara a un'isvilupu sustenìbile in sa comunidade nostra.
  ym-Institut-Suprieur-de-Management-Kolda:
    name: Les Femmes Leaders de ISM/Kolda
    description: Setzione de YouthMappers in s'Institut Supérieur de Management Kolda
    extendedDescription: Les Femmes Leaders de ISM/Kolda est unu grupu de cartografia fatu de fèminas ebbia, in su sud de su Senegal, chi cheret pònnere in sa mapa Kolda e sas biddas de inghìriu e cumprèndere mègius comente impreare OSM.
  ym-Institute-of-Crisis-Management-Studies:
    name: Institute of Crisis Management Studies YouthMappers
    description: Setzione de YouthMappers in s'Institute of Crisis Management Studies
    extendedDescription: Formare mapadores pro sas crisis, chi potzant agiudare cando b'at disastros.
  ym-Institute-of-Rural-Development-Planning:
    name: Mipango YouthMappers Chapter
    description: Setzione de YouthMappers in s'Institute of Rural Development Planning
    extendedDescription: "Sa Mipango YouthMappers Chapter est istada creada in s'IRDP su 3 de trìulas de su 2017 dae sa dotora Domitilla Bashemera. Sos membros fundadores fiant 300 (190 òmines e 110 fèminas), istudiantes de sa làurea triennale, registrados comente membros de sa setzione. Gerald Zacharia est su presidente de sa setzione e Juster Lugira est su vitze-presidente."
  ym-Institute-of-Rural-Development-Planning-Mwanza:
    name: Setzione de YouthMappers in s'Institute of Rural Development Planning - Lake Zone Centre
    description: Setzione de YouthMappers in s'Institute of Rural Development Planning Mwanza
  ym-Institute-of-Science-and-Veterinary-Medicine:
    name: YouthMappers ISSMV Dalaba
    description: Setzione de YouthMappers in s'Institute of Science and Veterinary Medicine
    extendedDescription: YouthMappers ISSMV Dalaba est un'organizatzione chene fines de lucru chi traballat pro promòvere sa cartografia umanitària e s'impreu de fontes abertas e de datos abertos pro creare ainas pro leare detzisiones in Guinea.
  ym-Istanbul-Technical-University:
    name: YouthMappers ITU
    description: Setzione de YouthMappers in s'Istanbul Technical University
    extendedDescription: YouthMappers ITU est una comunidade de istudiantes multidisciplinare e collaborativa chi promovet sa cartografia umanitària pro sos aposentamentos prus fràgiles e chi cheret isvilupare e cumpartzire informatziones ispatziales istratègicas e innovativas pro sas tzitades de cras, impreende sos sistemas de informatzione geogràfica e sos datos abertos.
  ym-Jacksonville-State-University:
    name: JSU Disaster Mapping Team
    description: Setzione de YouthMappers in sa Jacksonville State University
    extendedDescription: "Su JSU Disaster Mapping Team est unu programma de sa Jacksonville State University dedicadu a agiudare sa risposta a sos disastros in sos momentos de emergèntzia, comente trumbas de bentu, temporales fortes, alluviones e gasi sighende. S'iscuadra cheret èssere una resursa de valore pro sas conteas de inghìriu e unu caminu pro chi sos istudiantes de su Dipartimentu de sièntzias de sa terra de sa JSU potzant aplicare su chi ant imparadu in s'universidade pro sustènnere sos servìtzios de emergèntzia. S'obietivu nostru est de fàghere prus lestras e prus efitzientes sas operatziones de risposta e de recùperu a pustis de sos disastros, impreende sas abilidades de sos istudiantes."
  ym-Jahangirnagar-University:
    name: "YouthMappers at IRS, Jahangirnagar University"
    description: Setzione de YouthMappers in sa Jahangirnagar University
  ym-Jomo-Kenyatta-University-of-Agriculture-and-Technology:
    name: Assòtziu de sos istudiantes de ingegneria geomàtica
    description: Setzione de YouthMappers in sa Jomo Kenyatta University of Agriculture and Technology
    extendedDescription: "S'Assòtziu de sos istudiantes de ingegneria geomàtica (AGES) cheret promòvere produtos e servìtzios GIS e formare sos istudiantes in s'impreu issoro. Non promovet sa sotzializatzione intre sos istudiantes e sos professionistas ebbia, ma frunit fintzas una prataforma pro cumpartzire ideas noas pro organizare eventos noos de GIS e de rilievu e formatzione in s'universidade."
  ym-Kansas-State-University:
    name: "Gamma Theta Upsilon: Beta Psi Chapter"
    description: Setzione de YouthMappers in sa Kansas State University
    extendedDescription: "Semus sa setzione de sa Kansas State University de Gamma Theta Upsilon, una sotziedade internatzionale de onore de geografia aderente a YouthMappers. Amus fatu mapas pro OSM e amus organizadu una maratona de cartografia de nùmene «Map for Nepal», in ue amus impreadu OpenStreetMap pro disinnare sas zonas de su Nepal chi non fiant in sa mapa, a pustis de su terremotu de su 2015."
  ym-Karatina-University:
    name: Nature Club Karatina University
    description: Setzione de YouthMappers in sa Karatina University
    extendedDescription: "Custa setzione cheret aunire totu sos apassionados de GIS: espertos de ambiente, espertos de fàuna, funtzionàrios de sas abbas e de su turismu, pro nde nàrrere petzi unos cantos. S'obietivu printzipale suo est de frunire una prataforma in ue sos istudiantes potzant imparare s'unu dae s'àteru e, in su matessi tempus, cumprèndere comente integrare sas abilidades de GIS in sos caminos professionales issoro e agatare solutziones a isfidas ambientales diferentes."
  ym-Kenyatta-University:
    name: Kenyatta University GIS Club
    description: Setzione de YouthMappers in sa Kenyatta University
    extendedDescription: "Su Kenyatta University GIS Club (KUGISC) est nàschidu su 28 de santugaine de su 2016, cun prus de 200 membros intre istudiantes e personale de totu sas facultades de s'universidade. Nos impignamus a dare a sos membros sas connoschèntzias, sas abilidades e s'esperièntzia ispatziales chi bisòngiant pro cumprèndere sa Terra. Agiudamus a pònnere in sa mapa sas resursas de s'universidade integrende datos geogràficos in sos progetos issoro e regollende datos in su logu."
  ym-Khulna-University:
    name: Khulna University YouthMappers
    description: Setzione de YouthMappers in sa Khulna University
    extendedDescription: "Sos istudiantes e sos dotzentes de sa KU, de disciplinas diferentes, tenent esperièntzia in sa creatzione de datos abertos pro OSM pro afrontare sas isfidas locales de s'isvilupu, comente sa seguresa alimentare e àteros temas."
  ym-Kumi-University:
    name: Ever Last YouthMappers
    description: Setzione de YouthMappers in sa Kumi University
    extendedDescription: Custu grupu de istudiantes prenu de energia s'organizat in sa Facultade de sièntzias e de tecnologia de s'informatzione.
  ym-Kwame-Nkrumah-University-of-Science-and-Technology:
    name: Kwame Nkrumah University of Science and Technology YouthMappers
    description: Setzione de YouthMappers in sa Kwame Nkrumah University of Science and Technology
  ym-Makerere-University:
    name: Geo YouthMappers
    description: Setzione de YouthMappers in sa Makerere University
    extendedDescription: "Geo YouthMappers est una setzione de cartografia de sa Makerere University chi cheret aplicare sa cuntzetzione ispatziale a su mundu reale. Amus collaboradu cun OSM in vàrios eventos de cartografia. S'obietivu printzipale nostru est de semplificare sos datos e de los pònnere luego a disponimentu, prus che totu pro sa preparatzione a sos disastros. «Faghimus sa mapa de su mundu e cambiamus sas vidas.»"
  ym-Mbarara-University-of-Science-and-Technology:
    name: MUST Street Mappers
    description: Setzione de YouthMappers in sa Mbarara University of Science and Technology
    extendedDescription: MUST Street Mappers est una setzione de YouthMappers de sa Mbarara University of Science and Technology chi cheret fàghere de su paisu nostru e de totu su mundu unu logu mègius cun sa cartografia. Partimus dae sas informatziones regortas pro nde iscobèrrere sos modellos e pro nde bogare, cun s'anàlisi de sos datos, informatziones importantes e ùtiles pro sa sotziedade.
  ym-McGill-University:
    name: "Open Mapping Group McGill: A Member of the McGill Undergraduate Geography Society"
    description: Setzione de YouthMappers in sa McGill University
    extendedDescription: "S'Open Mapping Group McGill, membru de sa McGill Undergraduate Geography Society (OMG McGill), cheret pònnere in cuntatu sos istudiantes cun sos datos e cun sas tecnologias geogràficas abertas pro megiorare sa capatzidade de resistèntzia, sa crèschida de sa comunidade e s'imparu cun sa cartografia: in s'universidade, in Montreal, in Cànada e in s'èsteru."
  ym-Miami-University:
    name: Sotziedade de geografia e de pianificatzione
    description: Setzione de YouthMappers in sa Miami University
    extendedDescription: "Sa GPS de sa Miami University cheret creare una comunidade unida de espertos de pianificatzione e de geògrafos chi cherent s'ispassiare, ischire de prus subra de sas carreras e de s'istrutzione superiore in su campu issoro, connòschere gente noa e traballare a costadu de professionistas pro fàghere esperièntzia reale."
  ym-Moi-University:
    name: Assòtziu de sos istudiantes de geografia
    description: Setzione de YouthMappers in sa Moi University
    extendedDescription: "S'Assòtziu de sos istudiantes de geografia de sa Moi University (GEOSAMU) esplorat, iscoberit e cheret isvilupare totu su mundu cun sos giòvanos analistas de datos geogràficos. GEOSAMU est parte de su Dipartimentu de geografia."
  ym-Monroe-Community-College:
    name: MCC Mapping Corps
    description: Setzione de YouthMappers in su Monroe Community College
  ym-Namibia-University-of-Science-and-Technology:
    name: Sotziedade de sos istudiantes de tecnologias de s'informatzione geogràfica
    description: Setzione de YouthMappers in sa Namibia University of Science and Technology
  ym-Nimba-County-Community-College:
    name: Nimba County Community College Youth Mappers
    description: Setzione de YouthMappers in su Nimba County Community College
  ym-Njala-University-Freetown-Campus:
    name: Njala Freetown YouthMappers
    description: "Setzione de YouthMappers in sa Njala University, Freetown Campus"
    extendedDescription: "Semus istudiantes de sa Njala University Freetown Campus e istudiamus tecnologia de s'informatzione in su Dipartimentu de fìsica e informàtica. Semus in Henry Street, in Freetown, in Sierra Leone."
  ym-Njala-University-Njala-Campus:
    name: "YouthMappers Njala University, Njala Campus"
    description: "Setzione de YouthMappers in sa Njala University, Njala Campus"
  ym-Ohio-Wesleyan-University:
    name: Club de s'ambiente e de sa fàuna
    description: Setzione de YouthMappers in s'Ohio Wesleyan University
    extendedDescription: "Su Club de s'ambiente e de sa fàuna s'òcupat de sas chistiones ambientales in s'universidade, in Delaware e fintzas a livellu natzionale! Creamus progetos pro s'universidade e pro sa comunidade, esploramus sa natura e nos la godimus, traballamus comente voluntàrios e chircamus de promòvere sa tutela de s'ambiente in onni aspetu de sa vida nostra."
  ym-Oklahoma-State-University:
    name: Club de geografia
    description: Setzione de YouthMappers in s'Oklahoma State University
  ym-Open-University-of-Tanzania:
    name: Youth Mappers at Open University of Tanzania
    description: Setzione de YouthMappers in s'Open University of Tanzania
    extendedDescription: "Youth Mappers at Open University of Tanzania\n\nEst istadu fundadu dae membros e istudiantes de s'Open University of Tanzania de su Dipartimentu de geografia chi cherent prus che totu megiorare sa carrera issoro e agiudare sa comunidade de sos giòvanos cun progetos fatos impare e in collaboratzione cun grupos locales comente su Mikoko Scout Group (www.msg.or.tz), e incumintzare collaboratziones cun collègios e universidades internatzionales pro programmas de iscàmbiu in su campu de sos istùdios de geografia, comente unos cantos programmas preparados dae su Mikoko Scout Group chi ant a collegare s'universidade locale cun àteras universidades cun sos matessi interessos cun s'International Nature & Environmental Youth Camp 2019 (www.campsite.msg.or.tz/nature.html)\n\nSa setzione nostra at a èssere reconnota luego comente programma de una rete de giòvanos chi at a dare a sos istudiantes s'oportunidade de istudiare e de fàghere chircas a livellu locale."
  ym-Oregon-State-University:
    name: YouthMappers at Oregon State University
    description: Setzione de YouthMappers in s'Oregon State University
  ym-Politecnico-di-Milano:
    name: PoliMappers
    description: Setzione de YouthMappers in su Politecnico di Milano
    extendedDescription: PoliMappers est un'assòtziu de istudiantes voluntàrios cun sede in su Politecnico di Milano. Sa missione de su grupu est de formare e de motivare sa generatzione noa de mapadores voluntàrios e de fàghere mapas cun programmas lìberos e a còdighe abertu in s'universidade e fintzas in sas iscolas primàrias e segundàrias.
  ym-Queen-Mary-University-of-London:
    name: Queen Mary YouthMappers
    description: Setzione de YouthMappers in sa Queen Mary University of London
    extendedDescription: Custa setzione at a èssere parte de sas atividades de sa Queen Mary Geography Society.
  ym-Rajshahi-University-of-Engineering-Technology:
    name: YouthMappers at RUET
    description: Setzione de YouthMappers in sa Rajshahi University of Engineering & Technology
    extendedDescription: "«YouthMappers at RUET» est unu grupu de cartografia umanitària de istudiantes de sa Rajshahi University of Engineering & Technology (RUET) pro cumpartzire, isvilupare e pònnere in pràtica sa connoschèntzia de sos GIS. Custu grupu incoragit s'impreu de datos e de prataformas geogràficas a còdighe abertu pro agatare solutziones chi lompant a sas persones prus fràgiles de su mundu."
  ym-Sherubtse-College:
    name: Sotziedade geogràfica
    description: Setzione de YouthMappers in su Sherubtse College
    extendedDescription: "Sa Sotziedade geogràfica de su Dipartimentu de geografia e pianificatzione de su Sherubtse College, Royal University of Bhutan, cun su sustegnu de su Center for Climate Change and Spatial Information, at fatu meda pro creare cussèntzia e pro afrontare chistiones importantes a livellu locale e natzionale. Como nos aunimus a sa rete internatzionale de istudiantes de YouthMappers pro «Mapping for Resilience» e pro cuntribuire a una «felitzidade» mundiale!"
  ym-Sokoine-University-of-Agriculture:
    name: SMCoSE YouthMappers
    description: Setzione de YouthMappers in sa Sokoine University of Agriculture
    extendedDescription: "Una setzione fata de istudiantes de sièntzias e gestione ambientale e de istùdios de geografia de su Dipartimentu de geografia. Amus a impreare tècnicas de cartografia, basadas in cuntzetos e teorias de sos sistemas, chi si podent impreare pro fatzilitare, esplorare e regòllere sas diferentes cumprensiones de sas relatziones, de sas prospetivas e de sos lìmites de un'isvilupu chi rispetet s'ambiente, pro otènnere una cumprensione prus cumpleta de su cuntzetu e pro isvilupare pranos de atzione."
  ym-St.-Augustine-International-University:
    name: YouthMappers at St Augustine International University
    description: Setzione de YouthMappers in sa St. Augustine International University
  ym-St.-Mawaggali-Trades-Training-Institute:
    name: MawaggaliMappers
    description: Setzione de YouthMappers in su St. Mawaggali Trades Training Institute
    extendedDescription: Semus sa setzione de YouthMappers de su St. Mawaggali Trades de Choma e cherimus cuntribuire a sos diferentes còmpitos umanitàrios pro èssere a su servìtziu de sa gente cun sa cartografia.
  ym-State-University-of-New-York-Geneseo:
    name: SUNY Geneseo GIS Association
    description: Setzione de YouthMappers in sa State University of New York Geneseo
    extendedDescription: "Isparghimus cussèntzia, sustegnu, educatzione, traballu voluntàriu e oportunidades de crèschida professionale in sos sistemas de informatzione geogràfica, in totu sas disciplinas e sos dipartimentos, in sa SUNY Geneseo, in sa comunidade locale e in sa comunidade mundiale."
  ym-Stella-Maris-Polytechnic:
    name: YouthMappers-SMP
    description: Setzione de YouthMappers in su Stella Maris Polytechnic
  ym-SUNY-at-Fredonia:
    name: Geoventurers
    description: Setzione de YouthMappers in sa SUNY at Fredonia
    extendedDescription: "GeoVenturers est unu grupu de istudiantes de diferentes cursos de làurea de s'universidade nostra chi bident sas tecnologias geogràficas comente un'aina pro serbire a sos àteros e pro aunire sa gente. S'acumpangiamentu de su grupu benit dae su dipartimentu de didàtica, chi nos frunit sa formatzione in sas sièntzias. Isperamus de pòdere impreare sas abilidades nostras pro agiudare a megiorare sa vida de sa gente."
  ym-Technical-University-of-Kenya:
    name: Assòtziu de sos istudiantes de sièntzias geogràficas
    description: Setzione de YouthMappers in sa Technical University of Kenya
    extendedDescription: "Est unu grupu basadu in s'informatzione geogràfica, cun istudiantes apassionados meda de sos campos de istùdiu de interessu. Formamus sos membros subra de sas tendèntzias noas de su mercadu e sighimus sos progressos tecnològicos."
  ym-Texas-Tech-University:
    name: YouthMappers at TTU
    description: Setzione de YouthMappers in sa Texas Tech University
    extendedDescription: "Comente una de sas setziones chi ant fundadu sa rete, sos YouthMappers de sa TTU sunt cuntentos de serbire comente ghias multidisciplinares pro agiudare a creare datos e anàlisi geogràficas abertas chi afrontent isfidas de isvilupu definidas a livellu locale in totu su mundu. Sa setzione si impignat a fàghere iscàmbios e a collaborare cun àteras setziones de totu su mundu, e s'oferit fintzas comente resursa e servìtziu locale pro sas organizatziones de istudiantes de sa Texas Tech, agiudende·las a dare valore a sas atividades issoro in s'universidade cun sa cartografia."
  ym-The-Citadel:
    name: YouthMappers at The Citadel
    description: Setzione de YouthMappers in sa Citadel
    extendedDescription: "Custa setzione est fintzas unu Rotaract Club, chi est parte de su Rotary International. Medas membros, e fintzas sos dirigentes, ant mustradu interessu pro YouthMappers e nos diat praghere a assotziare su Rotaract Club nostru de sa Citadel a YouthMappers."
  ym-The-Gambia-YMCA-University-of-the-Gambia:
    name: Connected YouthMappers
    description: Setzione de YouthMappers in sa Gambia YMCA / University of the Gambia
    extendedDescription: Connected YouthMappers est fatu de giòvanos de sa Gàmbia impignados chi cherent cambiare e agiudare s'isvilupu natzionale.
  ym-The-George-Washington-University:
    name: Sotziedade de cartografia umanitària
    description: Setzione de YouthMappers in sa George Washington University
    extendedDescription: "Esempru de capatzidade de ghia e de partetzipatzione, sa Sotziedade de cartografia umanitària (HMS) chircat de dare agiudu e de megiorare su mundu cun progetos umanitàrios de sistemas de informatzione geogràfica (GIS). Custa setzione, una de sas chi ant fundadu sa rete, in s'universidade GWU, tenet meda esperièntzia de cumpartzire e collàborat a s'ispissu deretu cun USAID, cun sa Rughe Ruja americana e cun su Dipartimentu de Istadu de sos Istados Unidos in s'àrea de Washington DC pro allargare sos impignos ghiados dae sos istudiantes e pro serbire a sa comunidade mundiale."
  ym-The-Johns-Hopkins-University-SAIS:
    name: SAIS YouthMappers
    description: "Setzione de YouthMappers in sa Johns Hopkins University, SAIS"
    extendedDescription: "Sa missione de SAIS YouthMappers est de dare a sos istudiantes de sa SAIS de sa Johns Hopkins University s'oportunidade de divenire mapadores umanitàrios espertos meda. Comente grupu de su South Asia Club, s'òcupat prus che totu de sustènnere progetos de cartografia umanitària in sa regione de s'Otzèanu Indianu e de su Patzìficu."
  ym-The-Pennsylvania-State-University:
    name: Penn State GIS Coalition
    description: Setzione de YouthMappers in sa Pennsylvania State University
    extendedDescription: "Sa Penn State Geospatial Information Science (GIS) Coalition est un'organizatzione chi dat a sos istudiantes de GIS, comente matèria printzipale o segundària, e a chie at interessu pro sos GIS, s'oportunidade de isvilupare connoschèntzias e abilidades in prus chi bisòngiant pro tènnere sutzessu in su setore professionale de sos GIS."
  ym-The-University-of-Zambia:
    name: YouthMappers Unza
    description: Setzione de YouthMappers in s'University of Zambia
  ym-Uganda-Christian-University-Mbale-Campus:
    name: Mappers for Life
    description: Setzione de YouthMappers in s'Uganda Christian University Mbale Campus
    extendedDescription: "Semus s'iscuadra Mappers for Life! Beni e auni·ti a nois pro fàghere mapas impare! Custu grupu traballat dae su Dipartimentu de tecnologia de s'informatzione de s'UCU."
  ym-Uganda-Pentecostal-University:
    name: HiTech Youth Mappers
    description: Setzione de YouthMappers in s'Uganda Pentecostal University
    extendedDescription: Una setzione noa de YouthMappers in s'ovest de s'Uganda. Prontos a fàghere mapas e a frunire datos abertos cun OpenStreetMap pro fines de isvilupu.
  ym-Universidad-de-Antioquia:
    name: Geomatica UDEA
    description: Setzione de YouthMappers in s'Universidad de Antioquia
    extendedDescription: "Semus unu grupu interessadu a sos datos geogràficos, a sa cartografia voluntària e a sa partetzipatzione a sa cartografia cun àtera gente de su paisu nostru e de sa rete de YouthMappers."
  ym-Universidad-de-Costa-Rica:
    name: YouthMappers of the University of Costa Rica
    description: Setzione de YouthMappers in s'University of Costa Rica
    extendedDescription: "YouthMappers of the University of Costa Rica est nàschidu dae s'atzione sotziale de membros de comunidades diferentes subra de temas de partetzipatzione, de interatzione e de rapresentàntzia. OpenStreetMap nos permitit de regòllere, de verificare e de cumpartzire informatziones geogràficas in sas comunidades nostras pro su bene de totus."
  ym-Universidad-de-La-Guajira:
    name: Grupo Mesh
    description: Setzione de YouthMappers in s'Universidad de La Guajira
    extendedDescription: "Grupo Mesh est un'organizatzione de istudiantes de s'Universidad de la Guajira, in Colòmbia, cun istudiantes de su cursu de ingegneria ambientale chi imparant sa cartografia e sa cartografia aberta."
  ym-Universidad-de-Los-Andes:
    name: Cartografos Uniandes
    description: Setzione de YouthMappers in s'Universidad de Los Andes
    extendedDescription: "Semus unu tzìrculu de partetzipatzione de sos istudiantes chi cheret impreare sa cartografia e su pensamentu ispatziale comente aina pro creare ligàmenes de cooperatzione e de integratzione intre s'universidade e sa sotziedade, afrontende dinàmicas ispatziales, sotziales, polìticas, econòmicas e culturales diferentes."
  ym-Universidad-de-Puerto-Rico-Rio-Piedras:
    name: UPR YouthMappers
    description: Setzione de YouthMappers in s'Universidad de Puerto Rico - Rio Piedras
  ym-Universidad-de-San-Buenaventura:
    name: YouthMappers San Buenaventura
    description: Setzione de YouthMappers in s'Universidad de San Buenaventura
    extendedDescription: Semus cuntentos de nos aunire a YouthMappers pro fàghere mapas pro unu mundu e una comunidade mègius.
  ym-Universidad-Distrital-Francisco-Jose-de-Caldas:
    name: YouthMappers at Bogota
    description: Setzione de YouthMappers in s'Universidad Distrital Francisco Jose de Caldas
    extendedDescription: "S'Universidad Distrital Francisco José de Caldas est un'universidade pùblica, mista e de chirca, cun sede in Bogotà, in Colòmbia, cun 26.140 istudiantes."
  ym-Universidad-Jorge-Tadeo-Lozano:
    name: TadeoMappers at Universidad Jorge Tadeo Lozano
    description: Setzione de YouthMappers in s'Universidad Jorge Tadeo Lozano
    extendedDescription: "Istudiantes de Bogotà apassionados de atividades de cartografia chi sustenent sa diversidade biològica. Si cuntzentrant in sa cartografia de sos àrbores e in s'atividade in sas iscolas, cun s'obietivu de fàghere partetzipare totu sa comunidade a s'impignu pro s'ambiente."
  ym-Universidad-Jorge-Tadeo-Lozano-github:
    description: GitHub de sa setzione de YouthMappers TadeoMappers
    extendedDescription: "TadeoMappers, in collaboratzione cun su colletivu de programmas lìberos GNUTADEO, frunit depòsitos pro su traballu issoro. Sos duos grupos sunt parte de s'Universidad Jorge Tadeo Lozano e promovent s'impreu de ainas e de programmas de cartografia pro sustènnere progetos ghiados dae sa comunidade."
  ym-Universidad-Jorge-Tadeo-Lozano-instagram:
    description: Instagram de sa setzione de YouthMappers TadeoMappers
    extendedDescription: "TadeoMappers est parte de su grupu de programmas lìberos GNUTADEO, unu colletivu de s'Universidad Jorge Tadeo Lozano."
  ym-Universidad-Nacional-Autnoma-de-Honduras:
    name: PumaGis Hn
    description: Setzione de YouthMappers in s'Universidad Nacional Autónoma de Honduras
  ym-Universidad-Nacional-de-Colombia:
    name: Grupo UN
    description: Setzione de YouthMappers in s'Universidad Nacional de Colombia
    extendedDescription: Sos istudiantes si sunt aunende pro fàghere mapas e pro creare una rete cun sos istudiantes universitàrios de totu sa Colòmbia e de totu su mundu. Sas ispetzializatziones geogràficas includent ligàmenes cun sa microbiologia e cun sas disciplinas de sa salude.
  ym-Universidad-Nacional-de-Ingenieria:
    name: Yeka Street MGA
    description: Setzione de YouthMappers in s'Universidad Nacional de Ingenieria
    extendedDescription: "YEKA STREET est un'iscuadra de traballu formada dae istudiantes de s'Universidad Nacional de Ingeniería de Managua, in Nicaràgua. S'obietivu printzipale nostru est de aplicare sas connoschèntzias e sas abilidades nostras impreende medas ainas e aplicatziones pro pònnere in sa mapa zonas de sas tzitades nostras e cuntribuire a progetos de isvilupu de sa comunidade e a pranos de agiudu in casu de disastru. Cherimus abèrrere su caminu e atirare àteros istudiantes de totu sas carreras e de totu sas universidades de su paisu nostru pro chi s'aunant a nois in custa càusa, megiorende gasi sa calidade de sa vida e riduende sa fragilidade de sa populatzione."
  ym-Universidade-Eduardo-Mondlane:
    name: Comunidade YouthMappers Moçambique
    description: Setzione de YouthMappers in s'Universidade Eduardo Mondlane
    extendedDescription: "Semus unu grupu de istudiantes chi cheret aunire sa sotziedade de su Mozambicu pro creare una comunidade de cartografia umanitària capatze de resìstere. Sa comunidade cheret pònnere in sa mapa s'ocupatzione fìsica de su paisu nostru e creare datos geogràficos abertos, a disponimentu de su pùblicu e chi si potzant impreare in medas campos chene costos."
  ym-Universit-de-NZrkor:
    name: "YouthMappers N'Zérékoré"
    description: "Setzione de YouthMappers in s'University of N'Zérékoré"
    extendedDescription: YouthMappers faghet partetzipare sos istudiantes pro fàghere mapas in casu de disastros o de epidemias. Permitit fintzas de produire e de impreare datos cartogràficos de atzessu lìberu.
  ym-Universit-des-Sciences-Sociale-et-de-Gestion-de-Bamako:
    name: YouthMappers Bamako
    description: Setzione de YouthMappers in s'University of Social Sciences and Management of Bamako
  ym-Universit-Gaston-Berger:
    name: YouthMappers at UGB
    description: Setzione de YouthMappers in s'Université Gaston Berger
    extendedDescription: "YouthMappers UGB est fatu de giòvanos istudiantes e chircadores apassionados de cartografia. S'obietivu nostru est de megiorare sas abilidades de sos istudiantes in su campu de sa cartografia e de partetzipare a sa creatzione de datos geogràficos abertos chi rispondant a sas isfidas de s'isvilupu in totu su mundu e prus che totu in Àfrica."
  ym-Universit-Mohammed-V-Rabat:
    name: Brahmapoutre at Rabat
    description: Setzione de YouthMappers in s'Université Mohammed V Rabat
    extendedDescription: Custa setzione bidet sa partetzipatzione a su programma de YouthMappers comente un'oportunidade pro cumpartzire sas connoschèntzias nostras e pro creare relatziones de traballu noas cun àteras setziones de àteros paisos.
  ym-Universitas-Negeri-Makassar:
    name: Kontur Geografi
    description: Setzione de YouthMappers in s'Universitas Negeri Makassar
  ym-University-Muhammadiyah-Surakarta:
    name: SpaceTime
    description: Setzione de YouthMappers in s'University Muhammadiyah Surakarta
    extendedDescription: "SpaceTime est una comunidade de cartografia de sa Facultade de geografia de sa Muhammadiyah University of Surakarta. SpaceTime est istada fundada dae Bruce Maldy Pratama, Mukhlis Akbar e Irfandi Fauzi, istudiantes ativos de sa Facultade de geografia de s'University Muhammadiyah Surakarta."
  ym-University-of-California-Davis:
    name: Club de cartografia
    description: "Setzione de YouthMappers in s'University of California, Davis"
  ym-University-of-Cape-Coast:
    name: UCC Geographical Society
    description: Setzione de YouthMappers in s'University of Cape Coast
    extendedDescription: Semus una sotziedade chi aunit totu sos istudiantes chi istùdiant o ant istudiadu geografia in su Dipartimentu de geografia e pianificatzione regionale de s'University of Cape Coast. S'obietivu printzipale nostru est de promòvere s'interessu pro sa disciplina in intro e in foras de s'àula. Su motu nostru est «Cumprendimus sa Terra e sos abitantes suos».
  ym-University-of-Central-Florida:
    name: Sotziedade de s'informatzione geogràfica
    description: Setzione de YouthMappers in s'University of Central Florida
    extendedDescription: Sa missione nostra est de favorèssere un'ambiente sotziale e educativu pro sos istudiantes de totu sos cursos chi tenent interessu pro sa discussione e s'aplicatzione de sos GIS. Sos eventos de grupu e de comunidade de totu s'annu acadèmicu organizant sos istudiantes pro agiudare comente voluntàrios sas comunidades locales e regionales cun progetos de GIS basados in sa comunidade e pro imparare a sos istudiantes de sas iscolas mèdias e superiores de sa zona s'impreu e s'aplicatzione de sos GIS.
  ym-University-of-Chicago:
    name: Tobler Society
    description: Setzione de YouthMappers in s'University of Chicago
  ym-University-of-Dar-es-Salaam:
    name: YouthMappers at University of Dar es Salaam
    description: Setzione de YouthMappers in s'University of Dar es Salaam
    extendedDescription: "S'obietivu de sos University of Dar es Salaam YouthMappers est de impreare e de promòvere datos a còdighe abertu e tecnologias GIS pro pònnere in sa mapa sas zonas a arriscu de disastru, frunire resursas pro sa gestione de sas emergèntzias, pònnere in cuntatu sos membros suos cun organizatziones de còdighe abertu e de GIS de sa tzitade de Dar es Salaam e rispòndere a sos bisòngios chi ant a tènnere sos sòtzios de sos progetos nostros."
  ym-University-of-Energy-and-Natural-Resources:
    name: Eco-Club
    description: Setzione de YouthMappers in s'University of Energy and Natural Resources
    extendedDescription: Dare a totu sos tzitadinos un'educatzione sòlida subra de s'ambiente, chi est peorende, e favorèssere su mègius impreu e su recùperu de s'ambiente pro sa subravivèntzia de s'umanidade.
  ym-University-of-Exeter:
    name: University of Exeter British Red Cross Missing Maps
    description: Setzione de YouthMappers in s'University of Exeter
    extendedDescription: "Semus un'iscuadra de geògrafos apassionados cun una connoschèntzia cumpleta de sos GIS. Nos agradat a sustènnere sa British Red Cross Society in vàrios interventos de agiudu umanitàriu. Imparamus fintzas s'importàntzia de pònnere in sa mapa sos datos rilevados dae tesu e comente custu agiudat in su logu. Sas maratonas de cartografia nostras tenent temas acadèmicos chi ammustrant sas chircas diferentes de GIS de su dipartimentu de geografia nostru, e sunt fintzas eventos pro informare subra de su traballu, in ue invitamus persones chi nos contant sas carreras issoro in sos GIS o in sa British Red Cross."
  ym-University-of-Ghana:
    name: University of Ghana YouthMappers
    description: Setzione de YouthMappers in s'University of Ghana
    extendedDescription: "UG YouthMappers est fatu de istudiantes de làurea e de istudiantes laureados cun connoschèntzias e abilidades in sos GIS e in su rilievu dae tesu. Su club est fatu de un'iscuadra prena de energia, pronta a afrontare sas chistiones sotziales e a ridùere sos problemas ambientales cun sa cartografia. Sos printzìpios fundamentales nostros sunt sa formatzione de sas capatzidades, s'autonomia e su traballu de iscuadra."
  ym-University-of-Liberia-YouthMappers:
    name: University of Liberia YouthMappers
    description: Setzione de YouthMappers in s'University of Liberia YouthMappers
    extendedDescription: "Sos University of Liberia YouthMappers sunt una setzione de sa rete mundiale de YouthMappers. Semus un'organizatzione de cartografia de istudiantes chene fines de lucru, chi si cuntzentrat in sa cartografia pro s'isvilupu de sa Libèria e de totu su mundu. S'iscopu de custa organizatzione est de impreare sa tecnologia e sas connoschèntzias geogràficas pro creare e isvilupare mapas, e pro regòllere e analizare datos chi afrontent isfidas locales e mundiales. S'obietivu nostru est de sustènnere sos istudiantes e de lis dare s'oportunidade de isvilupare interessu e abilidades in su campu de sa cartografia. Pensamus a una comunidade de istudiantes unida, collaborativa e ativa, chi tèngiat gana de traballare cun sos University of Liberia YouthMappers pro megiorare sa vida de sos àteros."
  ym-University-of-Malawi:
    name: Chanco Malawi YouthMappers
    description: Setzione de YouthMappers in s'University of Malawi
    extendedDescription: "Chanco Malawi YouthMappers est s'organizatzione de cartografia de sos istudiantes de su Chancellor College de s'University of Malawi. Sos istudiantes de custa setzione si cuntzentrant in sa cartografia pro s'isvilupu de su Malawi e pro sos bisòngios de sa sièntzia."
  ym-University-of-Maryland-College-Park:
    name: Club de geografia
    description: Setzione de YouthMappers in s'University of Maryland - College Park
    extendedDescription: Sa missione de su Club de geografia de s'University of Maryland College Park est de fàghere partetzipare e de incoragiare sos istudiantes a esplorare sos interessos geogràficos issoro in s'universidade e in sa comunidade.
  ym-University-of-Mines-and-Technology:
    name: UMaT YouthMappers
    description: Setzione de YouthMappers in s'University of Mines and Technology
    extendedDescription: UMaT YouthMappers est unu grupu de istudiantes voluntàrios chi cherent dare a sos istudiantes s'oportunidade de megiorare sas abilidades issoro in su campu de sa cartografia e de sa creatzione de datos e de anàlisi geogràficas abertas chi afrontent isfidas de isvilupu definidas a livellu locale in totu su mundu.
  ym-University-of-Nairobi:
    name: Assòtziu de sos istudiantes de ingegneria geogràfica
    description: Setzione de YouthMappers in s'University of Nairobi
    extendedDescription: "Sos istudiantes de s'University of Nairobi sunt traballende cun sa comunidade locale de OSM, cun Map Kibera e cun GroundTruth pro imparare sa cartografia aberta e pro cuntribuire cun datos a sos bisòngios de sas comunidades urbanas issoro."
  ym-University-of-Nigeria-Enugu-Campus:
    name: LionMappersTeam (LMT) Enugu
    description: "Setzione de YouthMappers in s'University of Nigeria, Enugu Campus"
    extendedDescription: "Su LionMappersTeam (LMT) Enugu Campus est parte de sa rete de YouthMappers, cun s'ùnicu obietivu de dare a sos membros s'oportunidade de imparare e de megiorare sas abilidades issoro in su campu de s'informàtica geogràfica e de creare datos e anàlisi geogràficas abertas chi afrontent in totu su mundu isfidas definidas a livellu locale. Est un'iscuadra de voluntàrios pro sa cartografia collaborativa e pro sa frunidura de informatziones geogràficas cun OpenStreetMap, cun sa sièntzia tzitadina e cun àteras tecnologias geogràficas pro sa chirca, pro sa formatzione e pro rispòndere a sas isfidas de sas comunidades resistentes. Traballamus in sa cartografia web e in sas aplicatziones e in sa chirca de GIS e de rilievu dae tesu. Semus apassionados de s'informatzione geogràfica voluntària, de sos GIS partetzipativos e de sa sièntzia tzitadina. Sas atividades printzipales nostras sunt sa cartografia collaborativa in lìnia, sa cartografia in su logu, sos laboratòrios de formatzione e sas atividades in sas iscolas superiores, e fintzas sa cartografia umanitària e pro sa risposta a sos disastros."
  ym-University-of-Nigeria-Nsukka:
    name: LionMappersTeam (LMT) Nsukka
    description: "Setzione de YouthMappers in s'University of Nigeria, Nsukka"
    extendedDescription: "Su LionMappersTeam est parte de sa rete de YouthMappers, cun s'ùnicu obietivu de dare a sos membros s'oportunidade de imparare e de megiorare sas abilidades issoro in su campu de sa sièntzia cartogràfica e de creare datos e anàlisi geogràficas abertas chi afrontent in totu su mundu isfidas definidas a livellu locale. Est un'iscuadra de voluntàrios pro sa cartografia collaborativa e pro sa frunidura de informatziones geogràficas cun OpenStreetMap, cun sa sièntzia tzitadina e cun àteras tecnologias geogràficas pro sa chirca, pro sa formatzione e pro rispòndere a sas isfidas de sas comunidades resistentes. Traballamus in sas aplicatziones e in sa chirca de GIS e de rilievu dae tesu, in sos GIS partetzipativos e in sa sièntzia tzitadina, in sa cartografia in su logu, in sos laboratòrios de formatzione e in sas atividades in sas iscolas superiores."
  ym-University-of-North-Texas:
    name: UNT Geography Club
    description: Setzione de YouthMappers in s'University of North Texas
    extendedDescription: "Su Club de geografia est un'organizatzione de istudiantes de s'University of North Texas chi atzetat totu sos istudiantes interessados a sa geografia. S'obietivu de su Club de geografia est de promòvere s'interessu pro sa geografia, pro su cursu de làurea e pro su Dipartimentu de geografia, e s'amistade intre istudiantes e dotzentes. Su club chircat fintzas de rapresentare sos bisòngios e sos disìgios de sos istudiantes in s'istùdiu de sa geografia e de frunire unu logu de cunfrontu pro presentare ideas innovativas a benefìtziu de sa comunidade universitària."
  ym-University-of-Northern-Colorado:
    name: UNCO Geography and GIS Club
    description: Setzione de YouthMappers in s'University of Northern Colorado
    extendedDescription: "Setzione ufitziale de su Club de geografia e GIS de s'University of Northern Colorado, in ue s'obietivu nostru est de imparare, de cumpartzire e de istare in cuntatu cun sa gente chi tenimus a inghìriu. #MakingSenseOfTheWorld"
  ym-University-of-Port-Harcourt:
    name: UniqueMappersTeam (UMT) Port Harcourt
    description: Setzione de YouthMappers in s'University of Port Harcourt
    extendedDescription: "UniqueMappersTeam (UMT) Port Harcourt est unu grupu de atzione e un'iscuadra de voluntàrios pro sa cartografia collaborativa in lìnia, chi cheret formare sos membros e lis dare sas abilidades de cartografia prus noas pro creare datos e anàlisi geogràficas abertas chi afrontent isfidas de s'informatzione geogràfica definidas a livellu locale, e pro frunire servìtzios de cartografia umanitària a comunidades resistentes in su Delta de su Niger, in Nigèria e in àteros logos. Promovimus sa cartografia collaborativa e s'informatzione geogràfica voluntària cun sa prataforma de OpenStreetMap (OSM) e cun àteras prataformas chi totus podent impreare, pro sa cartografia de risposta lestra, sa cartografia de sos disastros, sa cartografia de inteligèntzia geogràfica, s'agiornamentu de sas mapas e sa formatzione. Est una setzione universitària aderente a s'Humanitarian OpenStreetMap Team (HOT). Est un'iscuadra de progetu de YouthMappers chi dat a sos membros s'oportunidade de imparare e de megiorare sas abilidades issoro in s'informàtica geogràfica pro esplorare oportunidades in totu su mundu in su campu de sa cartografia e de s'informatzione geogràfica."
  ym-University-of-Pretoria:
    name: Tzentru de sièntzias de s'informatzione geogràfica
    description: Setzione de YouthMappers in s'University of Pretoria
    extendedDescription: "Sos istudiantes chi ponent Pretòria in sa mapa sunt sustentos dae su Tzentru de sièntzias de s'informatzione geogràfica de s'University of Pretoria, una prataforma dae ue s'etzellèntzia de sas persones e de sas iscuadras de s'UP chi traballant in sa chirca, in s'educatzione e in sa formatzione, in sa crèschida professionale e in s'impignu pro sa comunidade in su campu de sa sièntzia de s'informatzione geogràfica (GISc) benit incoragiada e rinfortzada cun collaboratziones, educatzione, formatzione e alleàntzias in Sudàfrica e in s'èsteru."
  ym-University-of-Redlands:
    name: URSpatial Geo-Thinkers
    description: Setzione de YouthMappers in s'University of Redlands
    extendedDescription: "Megiorare sas abilidades de GIS de sos membros e sa connoschèntzia de sas ainas e de sos mètodos cun s'impignu sotziale aplicadu, e fàghere connòschere a sa comunidade de s'universidade su podere de sa cartografia e de s'anàlisi ispatziale cun eventos de servìtziu pro sa comunidade."
  ym-University-of-Rwanda-Huye-Campus:
    name: Rwanda YouthMappers
    description: Setzione de YouthMappers in s'University of Rwanda - Huye Campus
    extendedDescription: "Cun s'impignu e s'obietivu de promòvere sa cartografia, e cun sas informatziones de sas presentatziones pùblicas de YouthMappers, nos semus organizados comente istudiantes de su Dipartimentu de geografia impignados in sa cartografia pro fundare una setzione in s'universidade nostra. Semus sustentos dae su tutore nostru, su dotore Gaspard Rwanyiziri (diretore de su CGIS-Rwanda), e dae vàrios dotzentes chi nos faghent de mèntores."
  ym-University-of-South-Carolina:
    name: Assòtziu de sos istudiantes laureados de geografia
    description: Setzione de YouthMappers in s'University of South Carolina
    extendedDescription: "Sa GGSA est un'organizatzione gestida de su totu dae sos istudiantes, pensada pro difèndere e pro agiudare totu sos istudiantes laureados de geografia, faghende de ponte intre su dipartimentu e sos istudiantes. S'obietivu nostru est de favorèssere sa crèschida professionale, acadèmica e personale de sos istudiantes laureados interessados a su campu de sa geografia e a sas disciplinas suas."
  ym-University-of-Southern-California:
    name: SC Mappers
    description: Setzione de YouthMappers in s'University of Southern California
    extendedDescription: "Bidimus su mundu in un'àtera manera: lu castiamus cun una lente ispatziale. Cun sa fortza de su pensamentu ispatziale, collegamus logu e ispàtziu pro agiudare a afrontare sas isfidas mundiales. Collàbora cun nois!"
  ym-University-of-the-Philippines-Resilience-Institute:
    name: YouthMappers UP Resilience Institute
    description: Setzione de YouthMappers in s'University of the Philippines Resilience Institute
    extendedDescription: "S'UP Resilience Institute est nàschidu in su 2016 cun sa missione de rinfortzare sas comunidades locales cun chircas e atziones multidisciplinares pro sa capatzidade de resistèntzia. Cun s'UP NOAH Center e cun s'agiudu de organizatziones diferentes, amus frunidu mapas de s'espositzione de sos edifìtzios a sos perìgulos pro 17 provìntzias de sas 82 e amus carrigadu in OpenStreetMap prus de 4 milliones de perìmetros de edifìtzios."
  ym-University-of-the-Philippines-Resilience-Institute-twitter:
    name: YouthMappers UP Resilience Institute Twitter
  ym-University-of-the-West-Indies-Mona-Campus:
    name: Libraries Outreach - ODL
    description: "Setzione de YouthMappers in s'University of the West Indies, Mona Campus"
    extendedDescription: "Sa biblioteca de s'UWI, Mona Campus, partètzipat a progetos pùblicos, de divulgatzione e ispetziales. Custu at a dare a sa biblioteca nostra sos mèdios pro promòvere s'alfabetizatzione ispatziale e pro sustènnere sa cumpartzidura e s'atzessu a sos datos ispatziales de interessu pro sa Giamàica e pro sos Caràibes. Tenimus bisòngios de agiudu in casu de disastru e de comunicatzione, e bisòngios mannos in su campu de sas sièntzias de sa terra e de sos perìgulos naturales, pro serbire mègius s'universidade e sa comunidade nostra. In particulare, tenimus una biblioteca de sièntzias pro mustrare totu custu a sos dotzentes e a sos istudiantes."
  ym-University-of-Victoria:
    name: Sotziedade de sos istudiantes de geografia
    description: Setzione de YouthMappers in s'University of Victoria
    extendedDescription: "Sa SOGS cheret promòvere e rapresentare sos interessos sotziales e acadèmicos in su Dipartimentu de geografia, cun bator obietivos printzipales: frunire unu logu de discussione subra de sa calidade e de s'atzessibilidade de s'educatzione in sa geografia; frunire unu mèdiu pro espressare s'opinione cumpartzida de sos istudiantes a sos dotzentes de su dipartimentu, cun rapresentantes in sas riuniones e in sas cummissiones de su dipartimentu; organizare sas atividades chi sunt a benefìtziu de sos istudiantes e chi intrant in su campu de interessu de sos istudiantes de geografia; fàghere de ligàmene, cun s'UVSS e cun su Course Union Council, cun sos àteros grupos de istudiantes de s'universidade."
  ym-University-of-Warwick:
    name: University of Warwick Resilience Mapping Society
    description: Setzione de YouthMappers in s'University of Warwick
    extendedDescription: Semus unu grupu de mapadores apassionados de sa Warwick University. S'obietivu nostru est de fàghere apassionare sa gente a sa cartografia umanitària e de l'agiudare a cumprèndere s'impatu chi custa atividade tenet in su logu. Traballamus a curtzu cun Missing Maps e cun Doctors Without Borders UK e, in sas atividades de cartografia e in sos laboratòrios nostros, nos cuntzentramus in sos còmpitos de HOT. Sas maratonas de cartografia nostras sunt publicadas in sa pàgina de Missing Maps onni borta chi sunt programmadas.
  ym-University-of-Wyoming:
    name: Gamma Theta Upsilon/Geography Club
    description: Setzione de YouthMappers in s'University of Wyoming
  ym-University-of-Zimbabwe:
    name: UZMappers
    description: Setzione de YouthMappers in s'University of Zimbabwe
    extendedDescription: UzMappersTeam Zimbabwe est un'iscuadra de voluntàrios chi impreant OpenStreetMap pro sa cartografia de datos abertos e pro sa cartografia umanitària de risposta a sos disastros. S'iscuadra dat a sos membros suos abilidades in sas tecnologias geogràficas a còdighe abertu.
  ym-Vassar-College:
    name: Hudson Valley Mappers
    description: Setzione de YouthMappers in su Vassar College
    extendedDescription: "Sa missione nostra est de frunire una prataforma multidisciplinare pro cumpàngios, educadores e organizatziones de sa comunidade pro partetzipare a progetos de cartografia locale, cun s'obietivu de rinfortzare sos ambientes naturales de sa zona nostra, s'ambiente costrùidu e sa salude de sa comunidade nostra. Chircamus fintzas de dare unu sustegnu geogràficu a sos impignos mundiales de agiudu umanitàriu e de isvilupu."
  ym-Villanova-University:
    name: The Villanova Globeplotters
    description: Setzione de YouthMappers in sa Villanova University
    extendedDescription: "The Villanova Globeplotters si basat in su printzìpiu de Villanova, chi benit dae Santu Austinu, de su servìtziu generosu a sa comunidade mundiale. In unu clima sotziale serenu, nos impignamus a frunire agiudu geogràficu a chie nde tenet bisòngiu, chene contare sa ratza, su cursu de làurea, su grupu de istudiantes o su livellu de istùdios de sos istudiantes chi partètzipant."
  ym-West-Virginia-University:
    name: Maptime Morgantown
    description: Setzione de YouthMappers in sa West Virginia University
    extendedDescription: "Traballende comente un'iscuadra collaborativa, custa setzione, una de sas chi ant fundadu sa rete, si cuntzentrat in sa creatzione de un'ambiente abertu de imparu pro chie cheret traballare in progetos chi aunint s'isvilupu internatzionale, sa risposta a sas emergèntzias e sa sièntzia de s'informatzione geogràfica. Ponent in cuntatu printzipiantes e espertos dende formatzione tècnica e esperièntzia in sa creatzione de datos geogràficos de infrastrutura importantes e ùtiles, e in su matessi tempus si collegant cun tzitades gemellas de totu su mundu."
  ym-Western-Michigan-University:
    name: Club de geografia
    description: Setzione de YouthMappers in sa Western Michigan University
  ym-Yarmouk-University:
    name: YouthMappers at YU
    description: Setzione de YouthMappers in sa Yarmouk University
    extendedDescription: "Sa setzione de YouthMappers de sa YU est su primu grupu de cartografia de sa regione de s'Oriente Mèdiu e de s'Àfrica de su Nord, in ue sos pròfugos, sa sicagna e sa poberesa sunt crisis chi sunt creschende e chi tenent bisòngiu urgente de atividades de cartografia umanitària pro nde ridùere sas cunseguèntzias. Sos YU Mappers sunt incoragiados a impreare datos abertos pro afrontare sas isfidas de sa regione MENA e pro portare agiudu e isvilupu a sas zonas de sa regione chi nde tenent bisòngiu."
