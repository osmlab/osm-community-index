    description: Follow the Czech community on X - including translated WeeklyOSM!
  OSMF:
    name: OpenStreetMap Foundation
    description: OSMF is a UK-based not-for-profit that supports the OpenStreetMap Project
    extendedDescription: "OSMF supports the OpenStreetMap project by fundraising, maintaining the servers which power OSM, organising the annual State of the Map conference and coordinating the volunteers who keep OSM running. You can show your support and have a voice in the direction of OpenStreetMap by joining as an OSMF member here: {signupUrl}"
  ym-AASTU:
    extendedDescription: "The Association of Geomatics Engineering Students (AGES), aims at promoting GIS products and services as well as training students on the use of the same. It not only promotes socialisation between the students and practising professionals, but also provides a platform for exchanging new ideas for holding new GIS and surveying events and training at the university."
  ym-Clemson-University:
    extendedDescription: "Students in Clemson are supported by the Center for Geospatial Technologies, a community of interdisciplinary geospatial science practitioners supporting research, teaching and outreach activities using technologies that enable the collection, analysis and application of geospatial data. Students integrate geospatial technologies within their scholarly activities across all disciplines and build connections throughout the world."
  ym-Cornell-University:
    extendedDescription: "Cornell students and faculty use open data and open source software to address challenges at local, national and global scales. In doing so, we advance our academic and personal goals of developing our own skills around GIS and spatial literacy."
  ym-Cuttington-University:
    extendedDescription: "The YouthMappers at Cuttington University, Suakoko and Bong County comprised of Students from three different departments; namely, the Department of Natural Resources Management “DONRM”, Department of Environmental Sciences and the Department of Natural Sciences. Since the establishment of the Chapter in February 2017, the overall membership is 20 students, with each department containing 5 students."
  ym-George-Mason-University:
    extendedDescription: "Mason Mappers Student Society is a humanitarian mapping student organisation in the George Mason University GGS Department, and its goal is to promote education and knowledge in geo-technologies, geo-info science, to foster good global stewardship and engage in professional development while building a positive, interactive geo-community, as well as shaping students into leaders of tomorrow."
  ym-Kansas-State-University:
    extendedDescription: "We are the Kansas State University Chapter of Gamma Theta Upsilon, an international geography honour society with affiliation to YouthMappers. We have been active with mapping for OSM and conducted a mapathon called \"Map for Nepal,\" in which we used OpenStreetMap to digitise unmapped areas of Nepal after the earthquake in 2015."
  ym-Kumi-University:
    extendedDescription: This energetic group of students organises within the faculty of Science and Information Technology.
  ym-Miami-University:
    extendedDescription: "GPS at Miami University aims to create a close-knit community of planners and geographers who want to have fun, learn more about careers and higher education in their field, network and work alongside professionals for real experience."
  ym-Ohio-Wesleyan-University:
    extendedDescription: "Environment and Wildlife Club looks at environmental issues on campus, in Delaware and even nationally! We create campus and community projects, explore and enjoy the outdoors, volunteer and try to promote environmentalism in every aspect of our lives."
  ym-Open-University-of-Tanzania:
    extendedDescription: "Youth Mappers at Open University of Tanzania\n\nHad been founded by members and students of Open University of Tanzania in Department of Geography who are mainly need to improve their career and help young community through joint and partnership projects with local community groups such as Mikoko Scout Group (www.msg.or.tz) and start cooperation with international colleges and universities for exchange programs in relation to Geography Studies as some programs prepared by Mikoko Scout Group which will link local university and other universities of the same interest through International Nature & Environmental Youth Camp 2019 (www.campsite.msg.or.tz/nature.html )\n\nOur chapter will soon be recognised as youth network program that will open opportunity for students to study and conduct research studies at a local levels."
  ym-Sherubtse-College:
    extendedDescription: "The Geographical Society, in the Department of Geography & Planning, Sherubtse College, Royal University of Bhutan, with support from the Center for Climate Change and Spatial Information, has made several efforts to create awareness and address important issues at the local and national level. We now join hands with the international student-centred YouthMappers network on \"Mapping for Resilience\" and contributing to a global 'Happiness'!"
  ym-Texas-Tech-University:
    extendedDescription: "As one of the co-founding chapters of the network, the TTU YouthMappers are enthusiastic to serve as interdisciplinary leaders to help create open geographic data and analyses that address locally defined development challenges worldwide. The chapter strives to exchange and collaborate with other chapters around the globe while also offering themselves as a local resource and service to Texas Tech student organisations in ways that add value to their respecitive campus activities through mapping."
  ym-The-Pennsylvania-State-University:
    extendedDescription: "The Penn State Geospatial Information Science (GIS) Coalition is an organisation that offers students majoring, minoring or sharing an interest in GIS opportunities to develop supplementary knowledge and skills necessary to succeed in the professional GIS industry."
  ym-Universidad-de-La-Guajira:
    extendedDescription: "Grupo Mesh is a student organisation at the Universidad de la Guajira in Colombia, including students from the program of Environmental Engineering who learn cartography and open mapping."
  ym-University-of-Central-Florida:
    extendedDescription: Our mission is to foster a social and educational environment for all majors who are interested in the discussion and application of GIS. Group and community events throughout the academic year organise students to volunteer to help local and regional communities by using community-based GIS projects and educating local middle and high school students on the use and application of GIS.
  ym-University-of-Liberia-YouthMappers:
    extendedDescription: "The University of Liberia YouthMappers is a chapter organisation of the Global YouthMappers. We are a nonprofit student mapping organisation focus on mapping for Liberia’s development and the World at large. The purpose of this organisation shall be to utilise technology and geospatial knowledge as means of creating and developing maps; collecting and analysing data that will address local and worldwide challenges. Our aim is to support and create opportunity for students to develop interest and skills in the fields of mapping. We envision a united student community that are collaborative, active and are willing to work with the University of Liberia YouthMappers in order to better the lives of others."
  ym-University-of-Malawi:
    extendedDescription: "Chanco Malawi YouthMappers is the student mapping organisation for the University of Malawi's Chancellor College. The students in this chapter focus on mapping for Malawi's development and science needs."
  ym-University-of-North-Texas:
    extendedDescription: "The Geography Club is a student organisation at University of North Texas that welcomes all students who are interested in geography. The objective of the Geography Club is to promote interest in Geography, the Major and the Geography Department along with fellowship among students and faculty. The club also seeks to represent student needs and wants in regard to the study of geography and to provide a forum for the presentation of innovative ideas to the benefit of the University community."
  ym-University-of-Redlands:
    name: URSpatial Geo-Thinkers
    description: YouthMappers chapter at University of Redlands
    extendedDescription: "To build upon the members' GIS skills and knowledge of the tools and methods through applied social engagement as well as to educate the campus community about the power of mapping and spatial analysis through community service events."
  ym-University-of-Rwanda-Huye-Campus:
    name: Rwanda YouthMappers
    description: YouthMappers chapter at University of Rwanda - Huye Campus
    extendedDescription: "Based on the commitment and the purpose of promoting mapping, and the information from YouthMappers public talks, we have organised as students in Geography department who are committed in mapping to found a chapter of our Campus. We have supported by our Facilitator Dr. Gaspard Rwanyiziri (Director of CGIS-Rwanda) and various lecturer mentors."
  ym-University-of-South-Carolina:
    name: Geography Graduate Student Association
    description: YouthMappers chapter at University of South Carolina
    extendedDescription: "The GGSA is a fully student-run organisation, designed to serve as an advocate and resource for all geography graduate students by filling the role of liaison between the department and students. Our goal is to further professional, academic and personal development of graduate students interested in the field of geography and its sub disciplines."
  ym-University-of-Southern-California:
    name: SC Mappers
    description: YouthMappers chapter at University of Southern California
    extendedDescription: "We see the world differently: we view it through a spatial lens. With the power of spatial thinking, we connect place and space to help address global challenges. Collaborate with us!"
  ym-University-of-the-Philippines-Resilience-Institute:
    name: YouthMappers UP Resilience Institute
    description: YouthMappers chapter at University of the Philippines Resilience Institute
    extendedDescription: "The UP Resilience Institute was established in 2016 with a mission statement to empower local communities through multidisciplinary research and actions toward resilience. Through UP NOAH Center, and the help of different organisations, we have provided building exposure maps for 17 provinces out of the 82 and uploaded more than 4 million footprints to OpenStreetMap."
  ym-University-of-the-Philippines-Resilience-Institute-twitter:
    name: YouthMappers UP Resilience Institute Twitter
  ym-University-of-the-West-Indies-Mona-Campus:
    name: Libraries Outreach - ODL
    description: "YouthMappers chapter at University of the West Indies, Mona Campus"
  ym-University-of-Victoria:
    name: Society of Geography Students
    description: YouthMappers chapter at University of Victoria
  ym-University-of-Warwick:
    name: University of Warwick Resilience Mapping Society
    description: YouthMappers chapter at University of Warwick
  ym-Vassar-College:
    name: Hudson Valley Mappers
    description: YouthMappers chapter at Vassar College
    extendedDescription: "Our mission is to provide a multi-disciplinary platform for peers, educators and community organisations to engage in local mapping projects with a focus on strengthening our local ecosystems, our built environment and the health of our community. We also seek to contribute geospatial support for global humanitarian aid and development efforts."
  ym-Villanova-University:
    name: The Villanova Globeplotters
    description: YouthMappers chapter at Villanova University
  ym-West-Virginia-University:
    name: Maptime Morgantown
    description: YouthMappers chapter at West Virginia University
  ym-Western-Michigan-University:
    name: Geography Club
    description: YouthMappers chapter at Western Michigan University
  ym-Yarmouk-University:
    name: YouthMappers at YU
    description: YouthMappers chapter at Yarmouk University
    extendedDescription: "YouthMappers chapter at YU is the first mapping group in the Middle East and North Africa region where refugees, drought and poverty are rising crises and in urgent need for humanitarian mapping activities to mitigate the consequences of such crises. YU Mappers are encouraged to use open data to address challenges in MENA region to bring relief and development to target areas within the region."
