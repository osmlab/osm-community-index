  OSM-SoCal:
    name: OpenStreetMap 南加州
    description: "让我们玩乐吧，并且贡献画洛杉矶一带，以及学习有关画地图的一切！"
    extendedDescription: "OpenStreetMap（OSM）南加州拥抱对共同画OSM有兴趣的任何人。OSM是维基百科式运作的地图，是全世界尺度自由开源的地图，由全球超过 1,000,000 人的志工制作。我们欢迎所有人，如果你不大知道OSM，我们会教你，如果你有关于画地图计划，甚至野外实察，也是很棒的事情！"
  OSM-Tampa-Bay:
    name: OpenStreetMap 坦帕湾
    description: 坦帕湾地区的 OpenStreetMap 贡献者和使用者
    extendedDescription: "OpenStreetMap（OSM）坦帕湾群组让当地居民聚在一起，用OSM创建坦帕湾的准确地图。如果你使用地图、数据、开放原代码、GPS、徒步旅行或是骑自行车等等，你将会很喜欢与OSM合作，所以请加入我们吧！我们会聚在一起，制图并讨论每月的新主题。"
