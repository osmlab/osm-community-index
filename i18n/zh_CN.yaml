    name: Maptime 地拉那
    description: 以制图为主题的社交活动——欢迎新手参与！
    extendedDescription: "Maptime 是一个开放的学习环境，适合各种知识水平和程度的人，并为初学者提供有意的教育支持。Maptime 是一个同时具有灵活性和结构性的环境，其为制图教程、工作坊、具有共同目标的持续项目，以及独立/协作工作时间等创造了空间。"
