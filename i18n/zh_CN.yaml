    description: 位于怀俄明州的绘图者和 OpenStreetMap 用户
    extendedDescription: " OpenStreetMap （OSM）怀俄明州是一个本地协作组织，汇集了致力于制作自由地图的热心人士。我们鼓励全部绘图者在全州范围内组织或提出制图活动。聚会形式可以多种多样，包括简单的社交交流、从基础到进阶的OSM培训，或是社区制图聚会。"
