    name: Yer Çizenler
    description: Yer Çizenler 为每个人绘制协会
  ym-AASTU:
    name: 爱沙尼亚科技大学青年地图制作者
    extendedDescription: "测绘工程学生协会（AGES）致力于推广地理信息系统相关产品与服务，并开展相应应用培训。该协会不仅促进在校学生与行业从业者交流互动，也搭建创意分享平台，在校内筹办各类地理信息系统、测绘相关活动与培训。"
  ym-Abia-State-University:
    extendedDescription: "AbsuMappersTeam 是由地图爱好者组成的志愿团队，使用 OpenStreetMap、GIS 和其他开源地理空间技术解决问题。它致力于使用 OpenStreetMap 进行灾难应急响应。它是一个面向 GIS 和地图绘制爱好者的专业指导和赋能平台。它是一个由志愿者组成的社区，致力于地理空间数据创建、现场数据收集和地图绘制。该团队由 Victor N.Sunday（团队导师）和 J.U.Ogbonna 教授（团队协调员兼教职顾问）共同创立。AbsuMapperTeam 是 UniiqueMappersTeam-Port Harcourt 的附属机构。该团队致力于利用地理空间技术支持可持续发展。"
  ym-Ahmadu-Bello-University:
    extendedDescription: "我们是一群致力于提供人道主义服务以应对灾难和减灾的数据驱动的人道主义制图者。我们很高兴通过绘图贡献我们的专业知识和知识，并通过培训和协作帮助推广 #OpenEvangelism 。"
  ym-Asian-University-for-Women:
    extendedDescription: "亚洲女子大学旨在帮助毕业生习得专业技能、培养创新能力，或是投身商业与社区服务领域。该校学子兼顾工作与生活，并在亚洲乃至全球范围内，传播先进理念，推动人类社会与经济的可持续发展。"
  ym-California-University-of-Pennsylvania:
    extendedDescription: 加州大学（Cal U）地理信息系统专业的学生，学习将空间理论应用于实际场景。该学位课程以地理学为核心，同时侧重地理信息系统在应急管理中的应用。
  ym-Central-Washington-University:
    name: 地理俱乐部
  ym-Cornell-University:
    extendedDescription: "康奈尔大学的师生借助开放数据与开源软件，解决地方、全国乃至全球层面的各类难题。在此过程中，我们朝着学业与个人发展目标稳步迈进，锤炼GIS相关技能、提升空间素养。"
  ym-CURAT:
    name: 遥感研究与应用中心 YouthMappers
    description: "菲利克斯·乌弗埃·博瓦尼大学遥感研究与应用中心的 YouthMappers 分会"
    extendedDescription: 我们分会目的是推广合作绘制自由地图的使用，以及在研究与决策应用时运用 OpenStreetMap 资料，帮助学生在他们研究时能生成自己的资料。
  ym-Cuttington-University:
    extendedDescription: "卡廷顿大学、苏阿科科和邦县的年轻绘图者由来自三个不同部门的学生组成；即自然资源管理系、环境科学系和自然科学系。自 2017 年 2 月分会成立以来，会员总数为 20 名学生，每个系有 5 名学生。"
  ym-Dedan-Kimathi-University-of-Technology:
    name: GDEV
    description: 德丹·基马蒂科技大学青年地图制作者分会
  ym-Federal-School-of-Surveys:
    name: OyoMappersTeam (OMT) Oyo
  ym-Fourah-Bay-College:
    extendedDescription: "学生地理协会暨青年地图绘制团由弗拉湾学院学生组成，团队有着共同目标：为开展救援及其他公益工作，绘制塞拉利昂乃至全球的弱势区域地图，并开展各类调研与科普活动。该分部成员皆是富有想法、心系发展的青年，大家善于协作，能够以团队形式理解并落地各类可持续发展项目。"
  ym-George-Mason-University:
    extendedDescription: "梅森制图学生社团是乔治·梅森大学地理与地球科学系下属的公益制图学生组织。社团旨在普及地理技术与地理信息科学相关知识、开展相关教学，倡导全球共治理念，助力成员职业成长；同时打造积极活跃的地理交流社群，培养学生成为未来的行业领军者。"
  ym-Gujarat-University:
    name: 艾哈迈达巴德 CCIM
  ym-Heidelberg-University:
    name: 海德堡灾难地图绘制者
  ym-Insititue-d-Enseignement-Superieur-de-Ruhengeri:
    extendedDescription: 我们是卢旺达鲁亨盖里高等理工学院（INES-Ruhengeri）土地资源管理与土地测绘专业的学生，投身制图作业，依托地图绘制助力所在社区迈向可持续发展。
  ym-Institute-of-Science-and-Veterinary-Medicine:
    name: 青年地图制作者国际科学与社会地图制作协会（ISSMV）达拉巴分会
    description: 科学和兽医学院 YouthMappers 分会
    extendedDescription: YouthMappers ISSMV Dabala是一个非营利组织，致力于促进人道主义地图绘制以及使用开源和开放数据在几内亚建立决策工具。
  ym-Jacksonville-State-University:
    extendedDescription: "杰克逊维尔州立大学灾难绘图小组是杰克逊维尔州立大学的一项计划，致力于在紧急情况下协助救灾工作。其中包括龙卷风、强雷暴、洪水等。该团队旨在成为周边郡县的宝贵资产，并为杰克逊维尔州立大学地球科学系的学生提供一个渠道，将他们在学术环境中学到的知识用于支持应急服务。我们的目标是简化灾难响应和恢复行动，同时利用学生的技能组合"
  ym-Jomo-Kenyatta-University-of-Agriculture-and-Technology:
    extendedDescription: "测绘工程学生协会（AGES）致力于推广地理信息系统相关产品与服务，并开展实操应用培训。协会不仅增进学生与在职从业者的交流互动，还搭建创意交流平台，在校内举办各类地理信息系统及测绘相关活动与培训。"
  ym-Karatina-University:
    name: 卡蒂纳大学自然俱乐部
    description: 卡拉蒂纳大学青年地图制作者分会
    extendedDescription: "本章旨在汇集所有 GIS 爱好者。他们包括环境专家、野生动物专家、水产和旅游官员，仅举几例。其主要目的是提供一个平台，让学生可以相互学习，并在此过程中了解如何将 GIS 技能融入他们的各种职业道路，并为各种环境相关挑战提供解决方案。"
  ym-Kenyatta-University:
    name: 肯雅塔大学地理信息系统俱乐部
    description: 肯雅塔大学青年地图制作者分会
    extendedDescription: "肯雅塔大学地理信息系统社团（KUGISC）成立于2016年10月28日，校内各学院共有200余名师生加入。社团旨在帮助成员掌握认知地球所需的空间知识、技术与专业能力。我们结合地理空间数据与实地调研采集的数据，绘制校内各类资源分布图，并将相关技术应用到项目当中。"
  ym-Kwame-Nkrumah-University-of-Science-and-Technology:
    name: 恩克鲁玛科技大学的 YouthMappers
    description: 恩克鲁玛科技大学的 YouthMappers 分会
  ym-McGill-University:
    extendedDescription: "麦吉尔大学开放制图小组：麦吉尔大学本科地理学会（OMG McGill）的成员，旨在将学生与开放地理空间数据和技术联系起来，通过在校园、蒙特利尔、加拿大和国外进行制图，增强复原力、社区建设和学习能力。"
  ym-Miami-University:
    name: 地理与城市规划协会
    extendedDescription: "迈阿密大学地理与规划社团（GPS）致力于打造联系紧密的社群，汇聚规划专业与地理专业爱好者。大家在此交流玩乐、了解行业职业发展与深造方向、拓展人脉，并跟随业内人士实操历练，积累实战经验。"
  ym-Moi-University:
    extendedDescription: "莫伊大学地理学生协会（GEOSAMU）以探索新知、发掘机遇为己任，致力于培养青年地理空间分析人才，助力全球发展。该协会隶属于该校地理系。"
  ym-Monroe-Community-College:
    description: 门罗社区学院青年制图社分社
  ym-Ohio-Wesleyan-University:
    name: 环境与野生动物俱乐部
    extendedDescription: "环境与野生动物社团关注校园、特拉华州乃至全美范围内的环境问题。我们开展校园及社区项目，走进自然、体验户外，参与志愿活动，并力求在生活方方面面践行与推广环保理念。"
  ym-Oklahoma-State-University:
    name: 地理俱乐部
  ym-Open-University-of-Tanzania:
    extendedDescription: "坦桑尼亚开放大学青年制图师协会\n\n由坦桑尼亚开放大学地理系的成员和学生成立，他们主要需要通过与当地社区团体（如 Mikoko 童子军组织（www.msg.or.tz））的联合和合作项目来改善自己的职业生涯和帮助青年社区，并与国际高校合作开展与地理研究有关的交流项目，如 Mikoko 童子军组织准备的一些项目，这些项目将通过 2019 年国际自然与环境青年营（www.campsite.msg.or.tz/nature.html）将当地大学与其他具有相同兴趣的大学联系起来。\n\n我们的分会将很快被认可为青年网络项目，为学生提供在当地学习和开展研究性学习的机会。"
  ym-Sherubtse-College:
    name: 地理學會
  ym-Sokoine-University-of-Agriculture:
    extendedDescription: "我们将使用基于系统概念和理论的制图技术来促进、探索和捕捉对环境可持续性所涉及的关系、观点和边界的不同理解，从而更全面地理解这一概念并制定行动计划。"
  ym-SUNY-at-Fredonia:
    name: Geoventurers
  ym-The-Gambia-YMCA-University-of-the-Gambia:
    extendedDescription: Connected YouthMappers 由年轻甘比亚人组成，希望能改变和协助国家发展
  ym-The-George-Washington-University:
    extendedDescription: "本组织秉持榜样式领导力与积极参与的理念，依托人道地理信息系统（GIS）项目开展帮扶工作、改善全球现状。乔治华盛顿大学这支联合创办的附属分会经验丰富，常于华盛顿特区及周边地区，直接与美国国际开发署、美国红十字会、美国国务院展开合作，助力学生主导各类项目，服务全球社群。"
  ym-The-Johns-Hopkins-University-SAIS:
    extendedDescription: "约翰斯·霍普金斯大学下属保罗·尼采高级国际研究学院青年制图团（SAIS Youth Mappers），旨在为该院学生提供机会，培养成为专业能力过硬的公益制图人员。该社团隶属于南亚俱乐部，主要负责开展印太地区的人道制图项目。"
  ym-The-Pennsylvania-State-University:
    extendedDescription: "宾夕法尼亚州立大学地理空间信息科学（GIS）联盟，面向GIS专业主修、辅修学生及相关爱好者，帮助大家拓展知识、精进技能，为投身GIS行业打下扎实基础。"
  ym-Universidad-de-Antioquia:
    name: Geomatica UDEA
  ym-Universidad-de-La-Guajira:
    name: Grupo Mesh
  ym-Universidad-de-Los-Andes:
    name: Cartografos Uniandes
  ym-Universidad-Jorge-Tadeo-Lozano:
    extendedDescription: "波哥大的学生热衷于开展制图活动，以此助力生物多样性保护。团队主要绘制树木分布图，并走进校园推广相关活动，呼吁全体社区成员共同参与环保工作。"
  ym-Universidad-Jorge-Tadeo-Lozano-github:
    extendedDescription: "塔德奥制图团队联合GNUTADEO自由软件社群，为相关成果搭建代码资源库。两个组织均隶属于豪尔赫·塔德奥·洛萨诺大学，积极推广各类制图工具与软件，助力社区自主发起的项目开展。"
  ym-Universidad-Nacional-Autnoma-de-Honduras:
    name: PumaGis Hn
  ym-Universidad-Nacional-de-Colombia:
    name: Grupo UN
  ym-Universidad-Nacional-de-Ingenieria:
    name: Yeka Street MGA
    extendedDescription: "YEKA STREET 团队由尼加拉瓜马那瓜国立工程大学的学生组建。团队核心目标是运用专业知识与各类工具、应用程序绘制城市区域地图，助力社区项目建设与灾害救援预案落地。我们希望号召全国不同专业、不同院校的学生一同投身这项事业，以此提升民众生活水平、降低人群受灾风险。"
  ym-Universitas-Negeri-Makassar:
    name: Kontur Geografi
  ym-University-Muhammadiyah-Surakarta:
    name: SpaceTime
  ym-University-of-Cape-Coast:
    name: UCC地理学协会
    description: 海岸角大学的 YouthMappers 分会
    extendedDescription: 我们协会涵盖了开普敦大学地理与区域规划系全部正在阅读和阅读地理的学生。 我们的主要目的是提高对教室内外学科的兴趣。 我们的座右铭是“我们了解地球及其居民”。
  ym-University-of-Central-Florida:
    extendedDescription: 本社团旨在为所有专业、且乐于探讨和应用地理信息系统（GIS）的学子，营造交流学习的氛围。学年内我们会举办各类团体与社群活动，组织学生依托社区型GIS项目开展志愿服务，服务地方及周边区域；同时向当地初高中学生普及GIS的使用与实操知识。
  ym-University-of-Chicago:
    name: Tobler Society
  ym-University-of-Energy-and-Natural-Resources:
    description: 加纳能源与自然资源大学的 YouthMappers 分会
    extendedDescription: 为全部公民提供有关不断恶化的环境的良好教育，并最大程度地利用环境的重建来维持人类的生存。
  ym-University-of-Ghana:
    name: 加纳大学 YouthMappers
    description: 加纳大学 YouthMappers 分会
    extendedDescription: "加大 YouthMappers由拥有GIS和遥感知识和技能的研究生和本科生组成。 该俱乐部由一支充满活力的团队组成，该团队随时准备通过绘图解决社会问题并缓解环境问题。 我们的基本原则是能力建设、增强和团队合作。"
  ym-University-of-Liberia-YouthMappers:
    extendedDescription: "利比里亚大学青年制图团是全球青年制图者联盟的下属分会。本社团为非营利性学生制图组织，致力于通过制图工作助力利比里亚乃至全球发展。社团依托技术与地理空间知识制作、完善地图，收集并分析数据，以此应对各地及全球性难题。我们致力于为学生创造机会，培养大家对制图领域的兴趣与专业技能。我们期望凝聚一支团结协作、积极向上的学生队伍，携手开展工作，改善大众生活。"
  ym-University-of-Malawi:
    extendedDescription: "马拉威大学钱瑟勒学院青年制图团，是该校下设的学生制图组织。本分会成员专注开展制图工作，服务马拉威的发展与科研需求。"
  ym-University-of-Maryland-College-Park:
    name: 地理俱乐部
  ym-University-of-Mines-and-Technology:
    name: 加纳矿业大学 YouthMappers
    description: 加纳矿业大学 YouthMappers 分会
    extendedDescription: UMaT YouthMappers是一群学生志愿者，他们旨在为学生提供机会，以提高他们在制图领域的技能，并创建开放的地理数据和分析，以应对全球范围内本地定义的发展挑战。
  ym-University-of-Nigeria-Enugu-Campus:
    extendedDescription: "尼日利亚大学埃努古分校的 LionMappersTeam (LMT) 是 YouthMappers Network 的附属机构，其唯一目标是为成员提供学习和提高地理信息学技能的机会，并创建开放的地理数据和分析，以解决全球范围内的本地挑战。这是一个由志愿者组成的团队，使用 OpenStreetMap、公民科学和其他地理空间技术提供众包地图和地理信息，用于研究、培训和应对弹性社区挑战。我们参与网络制图、GIS 和遥感应用和研究。我们对志愿地理信息、参与式 GIS 和公民科学充满热情。我们的主要活动包括在线众包地图、现场制图、培训研讨会和高中推广以及人道主义/灾难响应地图绘制。"
  ym-University-of-Nigeria-Nsukka:
    extendedDescription: "LionMappersTeam 隶属于 YouthMappers Network，其唯一目标是为成员提供学习和提升地图科学技能的机会，并创建开放的地理数据和分析，以应对全球范围内的本地挑战。这是一个由志愿者组成的团队，致力于众包地图和地理信息提供，使用 OpenStreetMap、公民科学和其他地理空间技术进行研究、培训和应对韧性社区挑战。我们参与 GIS 和遥感应用与研究、参与式 GIS 和公民科学、实地测绘、培训研讨会以及面向高中的推广活动。"
  ym-University-of-North-Texas:
    extendedDescription: "地理俱乐部是北德克萨斯大学的一个学生组织，欢迎全部对地理感兴趣的学生。地理俱乐部的目标是提高学生和教师对地理、专业和地理系的兴趣，并建立友谊。该俱乐部还寻求代表学生在地理学习方面的需求和愿望，并为展示创新理念提供一个论坛，以造福大学社区。"
  ym-University-of-Port-Harcourt:
    extendedDescription: "哈科特港优质制图团队（UMT）是一支行动志愿团队，主打协作式在线制图。团队旨在培养成员掌握前沿制图技术，产出开放地理空间数据并开展分析，解决当地地理信息相关难题；同时为尼日利亚尼日尔三角洲及其他地区具备抗灾能力的社区提供人道制图服务。 我们依托 OpenStreetMap（OSM）及各类易用平台，推广众包制图与地理信息志愿服务，开展应急快速制图、灾害制图、地理情报制图、地图更新与技能培训等工作。 该组织是人道OSM团队（HOT）的校园附属分会，同时也是青年制图者联盟下设专项工作组，为成员提供地理信息学学习与技能提升的平台，助力大家发掘制图与地理信息领域的全球发展机遇。"
  ym-University-of-Pretoria:
    extendedDescription: "比勒陀利亚制图项目的全体学生，由比勒陀利亚大学地理信息科学中心提供支持。该中心作为专业平台，依托南非国内外的合作交流、教育培训与行业联盟，激励并助力校内师生及团队深耕地理信息科学领域，在科研、教学培训、职业发展与社区服务等方面精进成长。"
  ym-University-of-South-Carolina:
    extendedDescription: "地理研究生协会（GGSA）是完全由学生自主运营的组织。本协会充当院系与学生之间的沟通桥梁，为全体地理专业研究生发声并提供各类支持资源。我们致力于助力地理及其分支学科方向的研究生，实现专业能力、学术水平与个人素养的全面发展。"
  ym-University-of-the-West-Indies-Mona-Campus:
    extendedDescription: "西印度大学（UWI）莫纳校区图书馆开展公共服务、外展推广及各类专项项目。图书馆以此为抓手，推动大众空间素养提升，并倡导牙买加及加勒比地区的空间数据共享与开放获取。为更好地服务校园与社区，我们在灾害救援、信息沟通、地球科学及地质灾害研究等方面存在大量需求。馆内特设科学图书馆，面向全体师生展示相关资源与成果。"
  ym-University-of-Victoria:
    extendedDescription: "SOGS 致力于促进和代表地理系内的社会和学术利益。这体现在四个主要目标上： 为讨论有关地理系教育质量和可及性的问题提供一个论坛；通过代表学生参加系会议和系委员会，向系教师表达学生的一致意见；为学生的利益和地理系学生感兴趣的领域开展活动；通过 UVSS 和课程联盟理事会与校园内的其他学生团体进行联络。"
  ym-Vassar-College:
    extendedDescription: "我们的使命是为同行、教育工作者和社区组织提供一个多学科平台，让他们参与当地的测绘项目，重点是加强当地的生态系统、建筑环境和社区健康。我们还致力于为全球人道主义援助和发展工作提供地理空间支持。"
  ym-Villanova-University:
    description: 維拉諾瓦大學的年輕圖客分會
    extendedDescription: "维拉诺瓦全球飞行者协会（Villanova Globeplotters）秉承维拉诺瓦大学奥古斯丁的原则，为全球社会提供无私服务。在轻松的社交互动中，我们努力为有需要的人提供地理空间外联服务，无论参与学生的种族、学术专业、学生团体协会或大学生涯水平如何。"
  ym-West-Virginia-University:
    name: Maptime 摩根敦
    description: 西維吉尼亞大學的年輕圖客分會
    extendedDescription: "作为一个合作团队，这个共同创建的分会致力于为那些有兴趣参与国际发展、应急响应和地理信息科学交叉项目的人提供一个开放的学习环境。 他们通过提供技术培训和经验，帮助初学者和专家建立有意义、有用的地理基础设施数据，同时与世界各地的姐妹城市建立联系。"
  ym-Western-Michigan-University:
    name: 地理俱乐部
    description: 西密西根大學的年輕圖客分會
  ym-Yarmouk-University:
    name: YU 的年輕圖客分會
    description: 耶爾穆克大學的年輕圖客分會
    extendedDescription: "年轻绘图者 的 YouthMappers 分会是中东和北非地区的第一个测绘小组，该地区的难民、干旱和贫困等危机日益严重，迫切需要开展人道主义测绘活动，以减轻这些危机的后果。我们鼓励青年测绘者利用开放数据应对中东和北非地区的挑战，为该地区的目标区域带来救济和发展。"
