    name: 旧金山湾区 OpenStreetMap 贡献者
    description: 改进位于旧金山湾区的 OpenStreetMap
    extendedDescription: "这个小组是关于在（旧金山）湾区发展 OpenStreetMap 的社区。我们的活动对每个人开放，包括开源爱好者、骑自行车的人、GIS 专业人员、地理学家等。欢迎对地图、地图制作和免费地图数据感兴趣的任何人加入我们的小组并参加我们的活动。"
