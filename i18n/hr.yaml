  aberdeen-discord:
    name: OSM ABZ Discord
  af-matrix:
    description: 'Matrix grupa zajednice u Afganistanu. '
  al-maptime-tirana:
    name: Maptime Tirana
    description: 'Društveni događaji oko kartiranja - početnici su dobrodošli! '
    extendedDescription: "Maptime je otvoreno okruženje za učenje za sve razine i stupnjeve znanja, s namjerom pružiti obrazovnu podršku za početnike. Maptime je istovremeno fleksibilan i strukturiran, stvarajući prostor za poduku o kartiranju, radionice, tekuće projekte sa zajedničkim ciljem, te samostalno i zajedničko radno vrijeme. "
  am-wiki:
    description: "{community} Wiki page"
  at-matrix:
    description: 'Neslužbeni njemački Matrix kanal za Austriju '
  at-wiki:
    description: "{community} Wiki stranica"
  Bahia-telegram:
    extendedDescription: "Pridružite se zajednici kako biste više naučili o OpenStreetMap-u, postavljali pitanja ili sudjelovali na našim susretima. Svi su dobrodošli! "
  Bay-Area-OpenStreetMappers:
    name: Bay Area OpenStreetMappers
    description: Unaprijedite OpenStreetMap u Bay Area
    extendedDescription: "Ova grupa se bavi razvojem OpenStreetMap zajednice ovdje u Bay Area. Naši događaji su otvoreni za sve, od entuzijasta otvorenog koda, biciklista, GIS stručnjaka, geochachera i šire. Svatko tko je zainteresiran za karte, izradu karata i besplatne podatke o kartama dobrodošao je pridružiti se našoj grupi, te posjetiti naše događaje. "
  bd-facebook:
    extendedDescription: "Kartiranje u Bangladešu? Imate li pitanja, želite li se povezati sa našm zajednicom? Pridružite nam se u {url}. Svi su dobrodošli! "
  be-chapter:
    description: 'Pomažemo rastu i napretku OpenStreetMap-a u Belgiji. '
    extendedDescription: "Ako žellite pomoći unaprijediti i razviti kartogrqfsku zajednicu u Belgiji, kako biste još više ljudi zaludili kartiranjem OpenStreetMap Belgija je pravo mjesto za vas! "
  be-discourse:
    description: 'Forum za raspravu OpenStreetMap-a u Belgiji '
  be-matrix:
    description: 'Svi kartografi su dobrodošli! '
    extendedDescription: "Glavna soba za razgovor belgijske OSM zajednice. Ne oklijevajte ovdje postaviti početnička pitanja! "
  be-meetup:
    description: Susreti u stvarnom životu svih zainteresiranih za OpenStreetMap
    extendedDescription: "Fizički susreti su izvrsni za upoznavanje drugih kartografa, postavljanje pitanja i učenje puno toga. Posebno su dobrodošli novi suradnici!"
