  GeoPhilly:
    name: GeoPhilly
    description: Susreti za entuzijaste kartiranja na području Philadelphia-e
    extendedDescription: "GeoPhilly ujedinjuje programere, geografe, štrebere podataka, entuzijaste otvorenog koda, građanske hakere i ovisnike o kartama u našoj zajedničkoj ljubavi prema kartama i pričama koje one pričaju. Ako koristite karte kao dio vašeg rada ili samo želite više naučiti, ovo je susret za vas! Naši događaji nastoje biti otvoreni, prijateljski nastrojeni, edukativni i društveni i variraju od sretnih trenutaka do blic razgovora ili čak radionica. Pridružite nam se u kreiranju raznolike inspirirajuće geoprostorne zajednice u Philadelphiji!"
