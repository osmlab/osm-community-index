    name: Maptime Tirana
    description: Kaardistamisega seotud seltskondlikud ettevõtmised - algajad on vägagi teretulnud!
    extendedDescription: "Maptime on avatud õpikeskkond, mis sobib igale tasemele ja teadmiste tasemele ning pakub algajatele sihipärast haridusalast tuge. Maptime on üheaegselt paindlik ja struktureeritud, luues keskkonna kaardistamise õppetundidele, töötubadele, ühise eesmärgiga käimasolevatele projektidele ning iseseisvale ja koostööl põhinevale tööajale."
