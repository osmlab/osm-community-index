    extendedDescription: OpenStreetMap ディープサウスは、米国南東部にある地域密着型の地図作成コミュニティです。
  osm-delhi-xmpp:
    name: OpenStreetMap デリーのXMPP
    extendedDescription: OSM Delhi向けのXMPPルーム。独自のネットワークには接続されていません。
  OSM-Discord:
