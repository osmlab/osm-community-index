  af-matrix:
    description: アフガニスタンの地域社会のためのマトリックスグループ。
  al-maptime-tirana:
    name: Maptime ティラナ
    description: 地図作成に関連した交流イベントを開催します。初心者の方も大歓迎です！
    extendedDescription: "Maptimeは、あらゆるレベルと知識を持つ人々を対象としたオープンな学習環境であり、初心者向けに意図的な教育サポートを提供します。Maptimeは柔軟性と構造化を兼ね備えており、マッピングに関するチュートリアル、ワークショップ、共通の目標を持つ進行中のプロジェクト、そして個人作業や共同作業のための時間を確保できる場を提供します。"
  am-wiki:
    description: "{community} ウィキページ"
  at-matrix:
    description: オーストリア向けの非公式ドイツ語マトリックスチャンネル
  at-wiki:
    description: "{community} ウィキページ"
  Bahia-telegram:
    extendedDescription: "OpenStreetMapについてもっと知りたい方、質問がある方、ミーティングに参加したい方は、ぜひコミュニティにご参加ください。どなたでも大歓迎です！"
  Bay-Area-OpenStreetMappers:
    name: ベイエリア OpenStreetMappers
    description: ベイエリアのOpenStreetMapを改善する
    extendedDescription: "このグループは、ベイエリアにおけるOpenStreetMapコミュニティの拡大を目的としています。私たちのイベントは、オープンソース愛好家、サイクリスト、GIS専門家、ジオキャッシャーなど、あらゆる方にご参加いただけます。地図、地図作成、無料地図データに興味のある方ならどなたでも、私たちのグループへの参加やイベントへの参加を歓迎します。"
  bd-facebook:
    extendedDescription: "バングラデシュで地図を作成する？質問がありますか？このコミュニティと交流したいですか？ぜひ{url}にご参加ください。どなたでも大歓迎です！"
  be-chapter:
    description: 私たちはベルギーにおけるOpenStreetMapの成長と改善を支援しています。
    extendedDescription: "ベルギーの地図コミュニティの発展と成長に貢献し、より多くの人々に地図に夢中になってもらいたいなら、OpenStreetMap Belgiumはまさにあなたにぴったりの場所です！"
  be-discourse:
    description: ベルギーにおけるOpenStreetMapに関するフォーラム
  be-matrix:
    description: すべてのマッパーを歓迎します！
    extendedDescription: "ベルギーのOSMコミュニティのメインチャットルームです。初心者向けの質問も遠慮なくどうぞ！"
  be-meetup:
    description: OpenStreetMapに興味のある人なら誰でも参加できる対面での交流会
    extendedDescription: "対面での交流会は、他のマッパーと出会い、質問したり、多くのことを学んだりする絶好の機会です。特に、新しい貢献者の方々を大歓迎します！"
  be-newsletter:
    description: ベルギー人コミュニティの季刊ニュースレター
  bg-wiki:
    description: ブルガリアのWikiprojectページ
  bi-vc-cvl-meetup:
    description: "ビエッレーゼ、ヴェルチェッレーゼ、カナヴェーゼ、ヴァリ・ディ・ランツォのマッパーのローカル グループ"
    extendedDescription: "2018年2月からミーティングを開いており、通常はビエッラかイヴレアで開催されています。"
