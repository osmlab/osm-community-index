    extendedDescription: "インドで地図を作成する？質問がありますか？このコミュニティと交流したいですか？ぜひ{url}にご参加ください。どなたでも大歓迎です！"
  osm-india-mastodon:
    description: Fediverse上のOpenStreetMapインドコミュニティの本拠地
  osm-india-matrix:
    extendedDescription: "OSMインドの非公式チャットルーム。osmindia Telegramグループにも接続されています。"
  OSM-India-Puducherry-Facebook:
    name: フリーソフトウェア・ハードウェア運動 - Facebook
    description: "FSHMのFacebookページでコミュニティのイベントや活動について知ろう"
    extendedDescription: "FSHMは、フリーソフトウェア／ハードウェア、テクノロジー、社会活動、OpenStreetMapに関連するイベントを企画・運営しています。イベントに関する最新情報は、Facebookページをご覧ください。"
  OSM-India-Puducherry-Matrix:
    name: フリーソフトウェア・ハードウェア運動 - Matrix
    description: "FSHM Riotグループは、プドゥチェリーとその周辺地域でのマッピング活動やイベントについて話し合い、共有し、最新情報を提供しています。"
    extendedDescription: "FSHMコミュニティのメンバーは、Riot.imグループを通じてOSMのマッピングに関する最新情報や経験を共有しています。このグループは、フリーソフトウェア／ハードウェア、テクノロジー、社会運動に関連する事柄について議論するためにも利用されています。"
  osm-india-website:
    description: インドのマッパーとOpenStreetMapユーザー
  osm-india-wiki:
    description: "インドでの地図作成について知っておくべきことすべて：{url}"
  osm-india-xmpp:
    name: OpenStreetMap インドのXMPP
    extendedDescription: "インドのOSMコミュニティ向けのXMPPルーム。独自のネットワークには接続されていません。Matrixからも#osm-in:poddery.com経由で入手可能です。"
  osm-iran-aparat:
    extendedDescription: OpenStreetMapに関するあらゆる動画が揃った優れたリソース。主にペルシャ語。
  osm-iran-discord:
