  kosovo-flossk:
    name: フリー・リブレ・オープンソース・ソフトウェア・コソボ（FLOSSK）
    description: 2009年からFLOSSの普及に取り組んでいます
    extendedDescription: "フリー・リブレ・オープンソース・ソフトウェア・コソボ（FLOSSK）は、プリシュティナに拠点を置く非政府組織であり、フリーおよびオープンソースソフトウェアの支援、促進、開発を目的として2009年に設立されました。さらに、私たちはオープンで参加型の知識、オープンコースウェアを通じた情報技術教育、そして自由なコミュニケーションを活用したオープンスタンダード、文化、オープン社会にも貢献しています。"
