  OSM-Colorado:
    name: OpenStreetMap コロラド
    description: "アメリカ合衆国コロラド州のマッパーとOpenStreetMapユーザー"
    extendedDescription: "OpenStreetMap (OSM) コロラドは、無料の地図作成に貢献することに関心のある人々が集まった、地域密着型の共同プロジェクトです。私たちは、州内のあらゆる場所でマッピングイベントを企画したり提案したりすることを、すべてのマッパーに推奨しています。ミートアップの活動内容は、簡単な交流会、OSMの基礎から応用までのトレーニング、コミュニティマッピングパーティーなど多岐にわたります。"
  osm-de:
    description: ドイツのOpenStreetMapに関する情報プラットフォーム
  osm-deep-south-wiki:
