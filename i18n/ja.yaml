  vn-wiki:
    description: "{community} ウィキページ"
  ym-AASTU:
    name: AASTU Youth Mappers
    description: アディスアベバ科学技術大学のYouthMappers支部
    extendedDescription: "地理情報工学学生協会（AGES）は、GIS製品およびサービスの普及促進と、学生へのGIS利用に関する研修を目的としています。学生と実務専門家との交流を促進するだけでなく、大学における新たなGISおよび測量関連のイベントや研修の開催に関するアイデアを交換する場も提供しています。"
  ym-Abia-State-University:
    name: AbsuMappersTeam
    description: アビア州立大学のYouthMappers支部
    extendedDescription: "AbsuMappersTeamは、OpenStreetMap、GIS、その他のオープンソースの地理空間技術を用いて問題を解決する、地図愛好家によるボランティアチームです。OpenStreetMapを用いた災害対応に特化しており、GISとマッピングに情熱を持つ人々のための専門的なメンタリングと能力開発プラットフォームでもあります。地理空間データの作成、フィールドデータの収集、マッピングを行うボランティアのコミュニティです。このチームは、Victor N.Sunday（チームメンター）とJ.U.Ogbonna教授（チームコーディネーター兼教員アドバイザー）によって共同設立されました。AbsuMappersTeamはUniiqueMappersTeam-ポートハーコートの関連団体です。このチームは、地理空間技術を用いた持続可能な開発を支援することを目指しています。"
  ym-African-Methodist-Episcopal-University:
    name: YouthMappers-AMEU
    description: アフリカン・メソジスト・イピスコパル大学のYouthMappers支部
  ym-Ahmadu-Bello-University:
    name: ABU Geomappers
    description: アハマドゥ・ベロ大学のYouthMappers支部
    extendedDescription: "私たちは、データに基づいた人道支援マッピングを行うグループであり、災害対応と被害軽減のための人道支援活動に尽力しています。マッピングを通じて専門知識とノウハウを提供し、トレーニングやコラボレーションを通じて#OpenEvangelism（オープンエバンジェリズム）の普及に貢献できることを嬉しく思います。"
  ym-Ardhi-University:
    name: ARU Mapper
    description: アルディ大学のYouthMappers支部
    extendedDescription: 将来有望な地理空間データコンサルタントとして、私たちは社会に対し、空間データを単なる位置情報としてだけでなく、意思決定のツールとして活用し、自身や将来の世代に害を及ぼす可能性のある様々な危険や気候変動を予測する方法について、教育と助言を提供することを目指しています。
  ym-Arizona-State-University-facebook:
    description: アリゾナ州立大学のYouthMappers支部
  ym-Arizona-State-University-twitter:
    description: アリゾナ州立大学のYouthMappers支部
  ym-Asian-University-for-Women:
    name: YouthMappers at AUW
    description: アジア女子大学のYouthMappers支部
    extendedDescription: "アジア女子大学は、有能で革新的な専門家、企業や地域社会において奉仕精神にあふれたリーダー、そしてアジアおよび世界における異文化理解と持続可能な人間開発および経済発展の推進者となる女性を育成することを目指しています。"
  ym-Ball-State-University:
    name: ガンマ・シータ・ウプシロン - イオタ・オメガ支部
    description: ボール州立大学のYouthMappers支部
    extendedDescription: "私たちの支部は非常に活発に活動しています。主に地域イベント、募金活動、フィールドトリップに重点を置いています。現在、キャンパス内の他の学生にも参加してもらえるよう、地図作成関連の活動をさらに展開していく予定です。"
  ym-Busitema-University:
    name: Good Mappers
    description: ブシテマ大学のYouthMappers支部
    extendedDescription: Good mappersは、ブシテマ大学の学生チームです。その主な目的は、世界地図の作成に貢献できる経験豊富なマッパーのコミュニティを構築することです。
  ym-California-University-of-Pennsylvania:
    name: CalU PA GISクラブ
    description: ペンシルベニア大学カリフォルニア校のYouthMappers支部
    extendedDescription: カリフォルニア大学のGIS専攻の学生は、空間理論を現実世界に応用する方法を学びます。この大学の学位プログラムは、地理学だけでなく、緊急事態管理におけるGISの活用にも重点を置いています。
  ym-Central-Washington-University:
    name: 地理クラブ
    description: セントラル・ワシントン大学のYouthMappers支部
    extendedDescription: "Youthmappersと提携する私たちの目標は、人道的な地図作成を必要としている地域に支援を届けることです。そうすることで、世界中の仲間たちに貢献できるだけでなく、私たち自身の地図作成スキルも向上させることができます。"
  ym-Clemson-University:
    name: Clemson Mappers
    description: クレムソン大学のYouthMappers支部
    extendedDescription: "クレムソン大学の学生は、地理空間技術センターの支援を受けています。このセンターは、地理空間データの収集、分析、応用を可能にする技術を用いて、研究、教育、アウトリーチ活動を支援する、学際的な地理空間科学の専門家集団です。学生は、あらゆる分野にわたる学術活動に地理空間技術を統合し、世界中にネットワークを構築しています。"
  ym-Cornell-University:
    name: マッピング協会
    description: コーネル大学のYouthMappers支部
    extendedDescription: "コーネル大学の学生と教職員は、オープンデータとオープンソースソフトウェアを活用して、地域、国内、そして世界規模の課題に取り組んでいます。そうすることで、GISと空間リテラシーに関する自身のスキルを向上させるという、学術的および個人的な目標を推進しています。"
  ym-CURAT:
    name: YouthMappers CURAT
    description: "フェリックス・ウフエ・ボワニー大学のリモートセンシング研究応用大学センター（CURAT）にあるYouthMappers支部"
    extendedDescription: 当支部の目的は、共同型フリーマッピングの利用と、研究分野におけるOpenStreetMapデータの利用を促進し、意思決定ツールの実装への応用を推進することです。また、学生が自身の研究データを作成できるよう支援します。
  ym-Cuttington-University:
    name: カッティングトン大学 YouthMappers
    description: カッティングトン大学のYouthMappers支部
    extendedDescription: "カッティントン大学、スアココ、およびボン郡のYouthMappersは、自然資源管理学科（DONRM）、環境科学学科、自然科学学科の3つの学科の学生で構成されています。2017年2月の支部設立以来、会員総数は20名で、各学科から5名ずつ参加しています。"
  ym-Dedan-Kimathi-University-of-Technology:
    name: GDEV
    description: デダン・キマティ工科大学のYouthMappers支部
    extendedDescription: "GDEVは、DeKUTの熱心なGISグループであり、学生が地理空間に関する事柄について共有し、交流し、互いに学び合うことを支援することを目的としています"
  ym-Dhaka-College:
    name: YouthMappers ダッカ大学
    description: ダッカ大学のYouthMappers支部
    extendedDescription: "YouthMappers ダッカ大学は、人道支援活動の一環として、世界の脆弱な地域を地図化するために学生たちが取り組む活動です。YouthMappersは、学生たちが人道支援活動や地図作成を人道目的で活用する機会を提供します。このオープンな地理データは、教育、ナビゲーション、その他人道支援目的で利用できます。さあ、地図作成を楽しみましょう！"
  ym-Dhaka-University:
    name: Openstreetmap YouthMappers
    description: ダッカ大学のYouthMappers支部
    extendedDescription: "ダッカ大学の学生にとって、人道支援目的で地図を作成できることは大変光栄なことです。私たちの支部は、学生たちが人々を助け、人道支援のために地図作成を活用する機会を提供しています。"
  ym-Eastern-University:
    name: YouthMappers at イースタン大学
    description: イースタン大学のYouthMappers支部
    extendedDescription: "バングラデシュの YouthMappers at イースタン大学 は、人道危機に直面する人々を支援することを目的としています。同大学の学生たちは、世界中の他のマッパーたちと同様に、教育、ナビゲーション、その他の人道支援の目的で地図を活用できるよう、人々を支援することを誓っています。"
  ym-Far-Eastern-University-Institute-of-Technology:
    name: ジュニアフィリピンコンピュータ協会
    description: ファーイースタン大学技術研究所のYouthMappers支部
    extendedDescription: FEUはフィリピン有数の大学として認められています。その使命は、国の発展に貢献する卒業生を輩出することにあります。大学は、フィリピン国内だけでなく東南アジア地域においてもトップレベルの地位を確立するために、常に卓越性の基準を高めるべく努力を続けています。
  ym-Federal-School-of-Surveys:
    name: OyoMappersTeam (OMT) Oyo
    description: 連邦測量学校のYouthMappers支部
  ym-Fourah-Bay-College:
    name: "学生地理協会"
    description: フォーアー・ベイ大学のYouthMappers支部
    extendedDescription: "学生地理協会YouthMappersは、シエラレオネおよび世界各地の脆弱な地域を地図化し、救援活動やその他の有益な目的のために活用すること、研究活動やその他の教育的取り組みを行うことを共通の目標とする、フォーアー・ベイ大学の学生による協会です。この支部は、優れたアイデアを持ち、開発志向で、互いに協力し合い、持続可能な開発プロジェクトをチームとして理解し、実行する能力を備えた若者たちで構成されています。"
  ym-George-Mason-University:
    name: Mason Mappers
    description: ジョージ・メイソン大学のYouthMappers支部
    extendedDescription: "Mason Mappers学生協会は、ジョージ・メイソン大学地理情報学部（GGS）に所属する人道的な地図作成を専門とする学生団体です。その目的は、地理情報技術や地理情報科学に関する教育と知識を促進し、地球規模の責任感を育み、専門能力開発に取り組みながら、積極的でインタラクティブな地理情報コミュニティを構築し、学生を未来のリーダーへと育成することです。"
  ym-Grand-Gedeh-County-Community-College:
    name: YouthMappers at グランドゲデ・コミュニティ大学
    description: グランドゲデ・コミュニティ大学のYouthMappers支部
    extendedDescription: GGCCCのYouth Mappersの唯一の目的は、リベリアとその周辺地域にある、地図に載っていない場所を地図に載せることです。私たちはグランドゲデコミュニティカレッジの学生を集め、団結してこれらの場所を地理的に注目を集めることを使命としています。
  ym-Gujarat-University:
    name: CCIM at アメーダバード
    description: グジャラート大学のYouthMappers支部
  ym-Gulu-University:
    name: CSGU Mappers
    description: グル大学のYouthMappers支部
    extendedDescription: "CSGU Mappersは、グル大学のコンピューティング協会です。この支部は、創造性、情熱、革新性にあふれ、ウガンダ、そして世界全体を、人々の想像を超える形で地図化することを目指しています。"
  ym-Heidelberg-University:
    name: disastermappers ハイデルベルク
    description: ハイデルベルク大学のYouthMappers支部
    extendedDescription: "Disastermappers ハイデルベルクは、学生、研究者、人道支援関係者間の交流プラットフォームを構築することを目的とした学生主導のイニシアチブとして、2014年に設立されました。ディザスターマッパーズはミッシングマップスのメンバーであり、ハイデルベルク内外でマッパソン、ワークショップ、ウェビナーを開催するとともに、研究やアプリケーションを通じてHOTとミッシングマップスを支援しています。"
  ym-Ignatius-Ajuru-University-of-Education:
    name: IgnatiusMappersTeam (IMT)
    description: イグナティウス・アジュル教育大学のYouthMappers支部
    extendedDescription: 私たちはイグナティウス・アジュル教育大学のYouthMappers支部であり、クラウドソーシングによる環境マッピングや、回復力のあるコミュニティのリモートマッピングに取り組んでいます。私たちは、OpenStreetMapをはじめとするオープンな地理空間情報源を用いて地図を作成するボランティアチームです。
  ym-Indiana-University-of-Pennsylvania:
    name: 地理空間科学クラブ
    description: インディアナ大学ペンシルベニア校のYouthMappers支部
  ym-Insititue-d-Enseignement-Superieur-de-Ruhengeri:
    name: YouthMappers at INES ルヘンゲリ
    description: "ルヘンゲリ高等教育機関のYouthMappers支部"
    extendedDescription: 私たちはINES-ルヘンゲリの土地管理学科と測量学科の学生です。地域社会の持続可能な発展に向けた変化を生み出すための地図作成活動に取り組んでいます。
  ym-Institut-Suprieur-de-Management-Kolda:
    name: ISM/コルダの女性リーダーたち
    description: コルダ高等管理研究所のYouthMappers支部
    extendedDescription: ISM/コルダの女性リーダーたちは、セネガル南部を拠点とする女性だけの地図作成グループで、コルダとその周辺の村々を地図上に載せ、OpenStreetMap（OSM）の使い方をより深く理解することを目指しています。
  ym-Institute-of-Crisis-Management-Studies:
    name: 危機管理研究所 YouthMappers
    description: 危機管理研究所のユースマッパーズ支部
    extendedDescription: 災害発生時に役立つ危機マッピングツールを開発する。
  ym-Institute-of-Rural-Development-Planning:
    name: ミパンゴ YouthMappers支部
    description: 農村開発計画研究所のユースマッパーズ支部
    extendedDescription: "ミパンゴ YouthMappers支部は、2017年7月3日にドミティラ・バシェメラ博士によってIRDPで紹介されました。創設メンバーは、学部生300名（男性190名、女性110名）で、支部会員として登録されていました。ジェラルド・ザカリアが支部長で、ジャスター・ルギラが副支部長を務めています。"
  ym-Institute-of-Rural-Development-Planning-Mwanza:
    name: 農村開発計画研究所レイクゾーンセンターのYouthMappers支部
    description: ムワンザ農村開発計画研究所のYouthMappers支部
  ym-Institute-of-Science-and-Veterinary-Medicine:
    name: YouthMappers ISSMV ダラバ
    description: 科学獣医学研究所のYouthMappers支部
    extendedDescription: YouthMappers ISSMV ダラバは、ギニアにおいて人道支援マッピングの促進、および意思決定ツール構築のためのオープンソースとオープンデータの活用に取り組む非営利団体です。
  ym-Istanbul-Technical-University:
    name: YouthMappers ITU
    description: イスタンブール工科大学のYouthMappers支部
    extendedDescription: YouthMappers ITUは、脆弱な居住地のための人道的な地図作成を促進する学際的かつ協働的な学生コミュニティであり、地理情報システムとオープンデータを利用して、未来の都市のための戦略的かつ革新的な空間情報を開発・共有することを目指しています。
  ym-Jacksonville-State-University:
    name: JSU災害マッピングチーム
    description: ジャクソンビル州立大学のYouthMappers支部
    extendedDescription: "JSU災害マッピングチームは、ジャクソンビル州立大学（JSU）のプログラムで、竜巻、激しい雷雨、洪水などの緊急事態における災害対応を支援することを目的としています。このチームは、周辺地域にとって貴重な存在となること、そしてJSU地球科学科の学生が学術的な環境で学んだことを緊急サービス支援に応用できる場となることを目指しています。私たちの目標は、学生のスキルを活用しながら、災害対応と復旧活動を効率化することです。"
  ym-Jahangirnagar-University:
    name: "YouthMappers at IRS, ジャハンギルナガル大学"
    description: ジャハンギルナガル大学のYouthMappers支部
  ym-Jomo-Kenyatta-University-of-Agriculture-and-Technology:
    name: 地理情報工学学生協会
    description: ジョモ・ケニヤッタ農業技術大学のYouthMappers支部
    extendedDescription: "地理情報工学学生協会（AGES）は、GIS製品およびサービスの普及促進と、学生へのGIS利用に関する研修を目的としています。学生と実務専門家との交流を促進するだけでなく、大学における新たなGISおよび測量関連のイベントや研修の開催に関するアイデアを交換する場も提供しています。"
  ym-Kansas-State-University:
    name: "ガンマ・シータ・ウプシロン：ベータ・プサイ支部"
    description: カンザス州立大学のYouthMappers支部
    extendedDescription: "私たちは、カンザス州立大学のガンマ・シータ・ウプシロン支部で、YouthMappersと提携している国際的な地理学優等生協会です。私たちはOSMのマッピングに積極的に取り組んでおり、「Map for Nepal」というマパソンを実施しました。これは、2015年の地震後にOpenStreetMapを使用してネパールの未調査地域をデジタル化するものでした。"
  ym-Karatina-University:
    name: 自然クラブ カラティナ大学
    description: カラティナ大学のYouthMappers支部
    extendedDescription: "この支部は、GISに関心を持つあらゆる人々を結集させることを目的としています。環境専門家、野生生物専門家、水産・観光担当者など、ほんの一例を挙げただけでも多岐にわたります。主な目的は、学生同士が互いに学び合い、その過程でGISスキルをそれぞれのキャリアパスにどのように統合していくか、また、環境関連の様々な課題に対する解決策を見出す方法を理解するためのプラットフォームを提供することです。"
  ym-Kenyatta-University:
    name: ケニヤッタ大学GISクラブ
    description: ケニヤッタ大学のYouthMappers支部
    extendedDescription: "ケニヤッタ大学GISクラブ（KUGISC）は、2016年10月28日に設立され、キャンパス内の全学部から200名以上の学生と教職員が会員として参加しています。私たちは、地球を理解するために必要な空間知識、スキル、専門知識を会員に身につけてもらうことに尽力しています。地理空間データをプロジェクトやフィールドワークでのデータ収集に組み込むことで、大学内の資源マッピングを支援しています。"
  ym-Khulna-University:
    name: クルナ大学 YouthMappers
    description: クルナ大学のYouthMappers支部
    extendedDescription: "カンザス大学の学生と教員は、様々な分野にわたって、食料安全保障をはじめとする地域開発の課題に取り組むためのオープンデータ（OSM向け）の作成経験が豊富です。"
  ym-Kumi-University:
    name: Ever Last YouthMappers
    description: クーミ大学のYouthMappers支部
    extendedDescription: この活気あふれる学生グループは、理学部および情報技術学部内で組織されています。
  ym-Kwame-Nkrumah-University-of-Science-and-Technology:
    name: クワメ・ンクルマ科学技術大学 YouthMappers
    description: クワメ・ンクルマ科学技術大学のYouthMappers支部
  ym-Makerere-University:
    name: Geo YouthMappers
    description: マケレレ大学のYouthMappers支部
    extendedDescription: "Geo YouthMappersは、マケレレ大学を拠点とする地図作成団体であり、空間概念を現実世界に応用することを目指しています。私たちはOSMと様々なマッピングイベントで協力してきました。私たちの主な目的は、データを簡素化し、主に災害対策のために容易に利用できるようにすることです。私たちは世界を地図に描き、人々の生活を変えます。"
  ym-Mbarara-University-of-Science-and-Technology:
    name: MUST Street Mappers
    description: ムバララ科学技術大学のYouthMappers支部
    extendedDescription: MUST Street Mappersは、ムバララ科学技術大学のユースマッパーズ支部であり、地図作成を通して、私たちの国、ひいては世界をより良い場所にすることを目指しています。私たちは収集した情報に基づいてパターンを見つけ出し、データマイニングを行い、社会にとって有益で関連性の高い情報を提供します。
  ym-McGill-University:
    name: "マギル大学オープンマッピンググループ：マギル大学学部地理学会の会員"
    description: マギル大学のYouthMappers支部
    extendedDescription: "マギル大学オープンマッピンググループ（OMG McGill）は、マギル大学学部地理学会のメンバーとして、学生がオープンな地理空間データとテクノロジーにアクセスできるようにすることで、キャンパス内、モントリオール、カナダ国内、そして海外において、マッピングを通じてレジリエンス、コミュニティ構築、学習を促進することを目指しています。"
  ym-Miami-University:
    name: 地理学・都市計画学会
    description: マイアミ大学のYouthMappers支部
    extendedDescription: "マイアミ大学のGPSは、楽しみながら、それぞれの分野でのキャリアや高等教育について学び、人脈を築き、専門家と共に実務経験を積みたいと考える都市計画家や地理学者の緊密なコミュニティを形成することを目指しています。"
  ym-Moi-University:
    name: 地理学生協会
    description: モイ大学のYouthMappers支部
    extendedDescription: "モイ大学地理学生協会（GEOSAMU）は、若い地理空間アナリストを通して世界全体を探求、発見し、発展させることを目指しています。GEOSAMUは地理学科の一部です。"
  ym-Monroe-Community-College:
    name: MCCマッピング隊
    description: モンロー・コミュニティ・カレッジのYouthMappers支部
  ym-Namibia-University-of-Science-and-Technology:
    name: 地理情報技術学生協会
    description: ナミビア科学技術大学のYouthMappers支部
  ym-Nimba-County-Community-College:
    name: ニンバ・カウンティー・コミュニティ大学 Youth Mappers
    description: ニンバ・カウンティー・コミュニティ大学のYouthMappers支部
  ym-Njala-University-Freetown-Campus:
    name: ンジャラ・フリータウン YouthMappers
    description: "ンジャラ大学フリータウンキャンパスのYouthMappers支部"
    extendedDescription: "私たちは、ンジャラ大学フリータウンキャンパスの物理・コンピュータ科学科で情報技術を専攻している学生です。所在地はシエラレオネのフリータウン、ヘンリー通りです。"
  ym-Njala-University-Njala-Campus:
    name: "YouthMappers ンジャラ大学ンジャラキャンパス"
    description: "ンジャラ大学ンジャラキャンパスのユースマッパーズ支部"
  ym-Ohio-Wesleyan-University:
    name: 環境と野生生物クラブ
    description: オハイオ・ウェズリアン大学のYouthMappers支部
    extendedDescription: "環境・野生生物クラブは、キャンパス内、デラウェア州、そして全米における環境問題について考察します。キャンパスや地域社会のためのプロジェクトを企画・実施したり、アウトドアを楽しんだり、ボランティア活動を行ったり、生活のあらゆる面で環境保護を推進するよう努めています。"
  ym-Oklahoma-State-University:
    name: 地理クラブ
    description: オクラホマ州立大学のYouthMappers支部
  ym-Open-University-of-Tanzania:
    name: Youth Mappers at タンザニア・オープン大学
    description: タンザニア・オープン大学のYouthMappers支部
    extendedDescription: "Youth Mappers at タンザニア・オープン大学\n\nタンザニア・オープン大学地理学科のメンバーと学生によって設立されたこの組織は、主にキャリアアップと、ミココ・スカウト・グループ（www.msg.or.tz）などの地域コミュニティグループとの共同プロジェクトやパートナーシップを通じて若いコミュニティを支援すること、そしてミココ・スカウト・グループが準備した国際自然環境ユースキャンプ2019（www.campsite.msg.or.tz/nature.html）を通じて地元の大学と他の関心のある大学を結びつけるプログラムなど、地理学研究に関連する交換プログラムのために国際的な大学との協力を開始することを必要としています。\n\n私たちの支部は間もなく、学生が地域レベルで学習や研究を行う機会を提供する青少年ネットワークプログラムとして認められる予定です。"
  ym-Oregon-State-University:
    name: YouthMappers at オレゴン州立大学
    description: オレゴン州立大学のYouthMappers支部
  ym-Politecnico-di-Milano:
    name: PoliMappers
    description: ミラノ工科大学のYouthMappers支部
    extendedDescription: PoliMappersは、ミラノ工科大学を拠点とする学生ボランティア団体です。この団体の使命は、次世代のボランティアマッパーを育成・激励し、大学内だけでなく小中学校においても、フリーソフトウェアやオープンソースソフトウェアを用いた地図作成活動を行うことです。
  ym-Queen-Mary-University-of-London:
    name: クイーン・メアリー YouthMappers
    description: ロンドン大学クイーン・メアリー校のYouthMappers支部
    extendedDescription: この支部は、クイーン・メアリー大学地理学会の活動の一環として掲載されます。
  ym-Rajshahi-University-of-Engineering-Technology:
    name: YouthMappers at RUET
    description: ラジシャヒ工科大学のYouthMappers支部
    extendedDescription: "「YouthMappers at RUET」は、ラジシャヒ工科大学（RUET）の学生による人道的な地図作成グループであり、GISの知識を共有、発展、実践することを目的としています。このグループは、オープンソースの地理空間データとプラットフォームを活用して、世界で最も脆弱な立場にある人々への支援を実現するためのソリューションを開発することを推奨しています。"
  ym-Sherubtse-College:
    name: 地理学会
    description: シェラブツェ大学のYouthMappers支部
    extendedDescription: "ブータン王立大学シェラブツェ大学地理・都市計画学科の地理学会は、気候変動・空間情報センターの支援を受け、地域レベルおよび国家レベルでの意識向上と重要な課題への取り組みのために、様々な活動を行ってきました。私たちは今、国際的な学生中心のYouthMappersネットワークと協力し、「レジリエンスのためのマッピング」に取り組み、世界的な「幸福」の実現に貢献していきます！"
  ym-Sokoine-University-of-Agriculture:
    name: SMCoSE YouthMappers
    description: ソコイネ農業大学のYouthMappers支部
    extendedDescription: "環境科学と経営学の学生、および地理学科の地理学研究の学生で構成されるグループでは、システム概念と理論に基づいたマッピング技術を使用して、環境の持続可能性に関わる関係性、視点、境界に関するさまざまな理解を促進、探求、把握し、概念をより完全に理解し、行動計画を策定します。"
  ym-St.-Augustine-International-University:
    name: YouthMappers at 聖アウグスティヌス国際大学
    description: 聖アウグスティヌス国際大学のYouthMappers支部
  ym-St.-Mawaggali-Trades-Training-Institute:
    name: MawaggaliMappers
    description: セント・マワガリ職業訓練校のYouthMappers支部
    extendedDescription: 私たちはチョマにあるセント・マワガリ職業訓練校のYouthMappers支部です。地図作成を通して人々の生活に貢献する様々な人道支援活動を行いたいと考えています。
  ym-State-University-of-New-York-Geneseo:
    name: SUNY Geneseo GIS協会
    description: ニューヨーク州立大学ジェネセオ校のYouthMappers支部
    extendedDescription: "私たちは、SUNY Geneseo、地域社会、そしてグローバルコミュニティという文脈の中で、地理情報システムに関する意識向上、支援、教育、ボランティア活動、キャリアアップの機会を、分野や学部を超えて広めています。"
  ym-Stella-Maris-Polytechnic:
    name: YouthMappers-SMP
    description: ステラ・マリス工科大学のYouthMappers支部
  ym-SUNY-at-Fredonia:
    name: Geoventurers
    description: ニューヨーク州立大学フレドニア校のYouthMappers支部
    extendedDescription: "GeoVenturersは、本学の様々な専攻分野の学生が集まり、地理空間技術を他者への奉仕や人々の繋がりを深めるためのツールとして捉えているグループです。このグループのメンター制度には、カリキュラム・教育学部から科学教育に関する指導が提供されています。私たちは、自分たちのスキルを活かして人々の生活をより良くするお手伝いができればと願っています。"
  ym-Technical-University-of-Kenya:
    name: 地理空間科学学生協会
    description: ケニア工科大学のYouthMappers支部
    extendedDescription: "当グループは地理情報に基づいた活動を行っており、関連分野を専攻する非常に熱心な学生たちが集まっています。市場の最新動向に関する研修をメンバーに提供し、技術革新にも常に追随しています"
  ym-Texas-Tech-University:
    name: YouthMappers at TTU
    description: テキサス工科大学のYouthMappers支部
    extendedDescription: "ネットワークの共同設立支部の一つとして、TTU YouthMappersは、学際的なリーダーとして、世界各地で地域に根ざした開発課題に取り組むためのオープンな地理データと分析の作成に貢献することに意欲的です。この支部は、世界中の他の支部との交流や協力に努めるとともに、テキサス工科大学の学生団体に対し、地図作成などを通じてそれぞれのキャンパス活動に付加価値を与えるような、地域に根ざしたリソースおよびサービスを提供することを目指しています。"
  ym-The-Citadel:
    name: YouthMappers at シタデル大学
    description: シタデル大学のYouthMappers支部
    extendedDescription: "この支部はロータリー・インターナショナルの加盟団体であるローターアクト・クラブでもあります。複数の会員およびリーダーシップ陣がYouthMappersへの関心を示しており、当クラブのシタデル・ロータラクト・クラブをYouthMappersと提携させたいと考えています。"
  ym-The-Gambia-YMCA-University-of-the-Gambia:
    name: Connected YouthMappers
    description: ガンビアYMCA/ガンビア大学のYouthMappers支部
    extendedDescription: Connected YouthMappersは、変革を起こし、国の発展に貢献したいと願う、熱心なガンビアの若者たちで構成されています。
  ym-The-George-Washington-University:
    name: 人道地図作成協会
    description: ジョージ・ワシントン大学のYouthMappers支部
    extendedDescription: "リーダーシップと積極的な関与の模範として、HMSは人道支援のための地理情報システム（GIS）プロジェクトを通じて、世界をより良い場所にするための支援活動を行っています。GWUキャンパスに拠点を置くこの共同設立支部は、豊富な経験を有しており、学生主導の活動を拡大し、国際社会に貢献するため、ワシントンD.C.地域でUSAID、米国赤十字社、米国国務省と頻繁に直接連携しています。"
  ym-The-Johns-Hopkins-University-SAIS:
    name: SAIS YouthMappers
    description: "ジョンズ・ホプキンス大学SAISのYouthMappers支部"
    extendedDescription: "SAISユースマッパーズの使命は、ジョンズ・ホプキンス大学SAISの学生に、高度なスキルを持つ人道支援地図作成者になる機会を提供することです。南アジアクラブのグループとして、インド太平洋地域における人道支援地図作成プロジェクトの支援を主な活動としています。"
  ym-The-Pennsylvania-State-University:
    name: ペンシルベニア州立大学GIS連合
    description: ペンシルベニア州立大学のYouthMappers支部
    extendedDescription: "ペンシルベニア州立大学地理空間情報科学（GIS）連合は、GISを専攻、副専攻、または関心を持つ学生に対し、プロのGIS業界で成功するために必要な補足的な知識とスキルを身につける機会を提供する組織です。"
  ym-The-University-of-Zambia:
    name: YouthMappers Unza
    description: ザンビア大学のYouthMappers支部
  ym-Uganda-Christian-University-Mbale-Campus:
    name: Mappers for Life
    description: ウガンダキリスト教大学ムバレキャンパスのYouthMappers支部
    extendedDescription: "私たちはチームMappers for lifeです！ぜひ私たちと一緒に地図作成に参加してください！このグループはUCUの情報技術学部を拠点として活動しています。"
  ym-Uganda-Pentecostal-University:
    name: HiTech Youth Mappers
    description: ウガンダ・ペンテコスタル大学のYouthMappers支部
    extendedDescription: ウガンダ西部にYouthmappersの新しい支部が設立されました。開発目的でOpenStreetMapを使って地図を作成し、オープンデータを提供する準備が整っています。
  ym-Universidad-de-Antioquia:
    name: Geomatica UDEA
    description: アンティオキア大学のYouthMappers支部
    extendedDescription: "私たちは、地理空間データ、ボランティアによる地図作成、そして国内およびYouthMappersネットワーク内で他の人々と共に地図作成に参加することに関心を持つグループです。"
  ym-Universidad-de-Costa-Rica:
    name: コスタリカ大学のYouthMappers
    description: コスタリカ大学のYouthMappers支部
    extendedDescription: "コスタリカ大学のYouthMappersは、参加、交流、代表性というテーマに基づき、多様なコミュニティのメンバーによる社会活動から生まれました。OpenStreetMapを利用することで、地域社会内で地理情報を収集、検証、共有し、すべての人々の利益につなげることができます。"
  ym-Universidad-de-La-Guajira:
    name: グループMesh
    description: グアヒラ大学のYouthMappers支部
    extendedDescription: "グループMeshは、コロンビアのグアヒラ大学にある学生団体で、環境工学科の学生が地図作成やオープンマッピングを学ぶために参加しています。"
  ym-Universidad-de-Los-Andes:
    name: Cartografos Uniandes
    description: ロスアンデス大学のYouthMappers支部
    extendedDescription: "私たちは、学生が主体となって活動するグループであり、マッピングと空間的推論を手段として、様々な空間的、社会的、政治的、経済的、文化的ダイナミクスに取り組むことで、大学と社会との間に協力と統合の絆を築くことを目指しています。"
  ym-Universidad-de-Puerto-Rico-Rio-Piedras:
    name: UPR YouthMappers
    description: プエルトリコ大学リオピエドラス校のYouthMappers支部
  ym-Universidad-de-San-Buenaventura:
    name: YouthMappers サン・ブエナベンチュラ
    description: サン・ブエナベンチュラ大学のYouthMappers支部
    extendedDescription: より良い世界とコミュニティを目指して地図作成に取り組むYouthMappersに参加できることを嬉しく思います。
  ym-Universidad-Distrital-Francisco-Jose-de-Caldas:
    name: YouthMappers at ボゴタ
    description: フランシスコ・ホセ・デ・カルダス地区大学のYouthMappers支部
    extendedDescription: "ディストリタル フランシスコ ホセ デ カルダス大学は、コロンビアのボゴタに本拠を置く共学の公立研究大学で、学生数は 26,140 人です"
  ym-Universidad-Jorge-Tadeo-Lozano:
    name: TadeoMappers at ホルヘ・タデオ・ロサーノ大学
    description: ホルヘ・タデオ・ロサーノ大学のYouthMappers支部
    extendedDescription: "ボゴタの学生たちは、生物多様性を支援する地図作成活動に情熱を注いでいます。彼らは樹木の地図作成に重点を置き、これらの活動を学校に取り入れることで、地域社会全体を環境保護活動に巻き込むことを目指しています。"
  ym-Universidad-Jorge-Tadeo-Lozano-github:
    description: YouthMappers支部TadeoMappersのGitHub
    extendedDescription: "TadeoMappersは、GNUTADEOフリーソフトウェア集団と協力して、彼らの作品のリポジトリを提供しています。両グループはホルヘ・タデオ・ロサーノ大学に所属しており、コミュニティ主導のプロジェクトを支援するマッピングツールとソフトウェアの利用を推進しています。"
  ym-Universidad-Jorge-Tadeo-Lozano-instagram:
    description: YouthMappers支部TadeoMappersのInstagram
    extendedDescription: "TadeoMappersは、ホルヘ・タデオ・ロサーノ大学の学生によるフリーソフトウェアグループGNUTADEOの一員です。"
  ym-Universidad-Nacional-Autnoma-de-Honduras:
    name: PumaGis Hn
    description: ホンジュラス国立自治大学のYouthMappers支部
  ym-Universidad-Nacional-de-Colombia:
    name: グループUN
    description: コロンビア国立大学のYouthMappers支部
    extendedDescription: 学生たちは、コロンビア国内および世界中の大学生と連携し、ネットワークを構築するために協力しています。地理的な専門分野としては、微生物学や健康関連分野との関連が挙げられます。
  ym-Universidad-Nacional-de-Ingenieria:
    name: Yeka Street MGA
    description: 国立工科大学のYouthMappers支部
    extendedDescription: "YEKA STREETは、ニカラグアのマナグアにある国立工科大学の学生で構成されたチームです。私たちの主な目的は、様々なツールやアプリを活用して都市の地域をマッピングし、地域社会の発展プロジェクトや災害救援計画に貢献することです。私たちは、この活動に賛同してくれる国内のあらゆる学部や大学の学生を積極的に募り、生活水準の向上と人々の脆弱性の軽減を目指しています。"
  ym-Universidade-Eduardo-Mondlane:
    name: Comunidade YouthMappers モザンビーク
    description: エドゥアルド・モンドラーネ大学のYouthMappers支部
    extendedDescription: "私たちは、モザンビーク社会に加わり、人道支援マッピングの強固なコミュニティを構築することを目指す学生グループです。このコミュニティは、モザンビーク国内の占領状況を地図化し、一般公開された地理データを作成することを目指しています。このデータは、費用負担なしで様々な分野で利用可能です。"
  ym-Universit-de-NZrkor:
    name: "YouthMappers ンゼレコレ"
    description: "ンゼレコレ大学のYouthMappers支部"
    extendedDescription: YouthMappersは、災害や伝染病発生時に学生たちが地図を作成する活動を支援します。また、地図データの作成と利用を無料で提供します。
  ym-Universit-des-Sciences-Sociale-et-de-Gestion-de-Bamako:
    name: YouthMappers バマコ
    description: バマコ社会科学経営大学のYouthMappers支部
  ym-Universit-Gaston-Berger:
    name: YouthMappers at UGB
    description: ガストン・ベルジェ大学のYouthMappers支部
    extendedDescription: "YouthMappers UGBは、地図作成に情熱を燃やす若い学生や研究者で構成されています。私たちの目標は、学生の地図作成分野におけるスキルを向上させ、世界、特にアフリカにおける開発課題に対応するオープンな地理データの作成に貢献することです。"
  ym-Universit-Mohammed-V-Rabat:
    name: Brahmapoutre at ラバト
    description: ラバト・モハメッド5世大学のYouthMappers支部
    extendedDescription: この支部では、YouthMappersプログラムへの参加を、知識を共有し、他国の支部と新たな協力関係を築く機会と捉えています
  ym-Universitas-Negeri-Makassar:
    name: Kontur Geografi
    description: マカッサル州立大学のYouthMappers支部
  ym-University-Muhammadiyah-Surakarta:
    name: SpaceTime
    description: ムハンマディヤスラカルタ大学のYouthMappers支部
    extendedDescription: "SpaceTimeは、スラカルタ・ムハマディヤ大学地理学部のコミュニティマッピングプロジェクトです。SpaceTimeは、ブルース・マルディ・プラタマ、ムクリス・アクバル、イルファンディ・ファウジによって設立されました。彼らはスラカルタ・ムハマディヤ大学地理学部の現役学生です。"
  ym-University-of-California-Davis:
    name: Mapping Club
    description: "カリフォルニア大学デービス校のYouthMappers支部"
  ym-University-of-Cape-Coast:
    name: UCC地理学会
    description: ケープコースト大学のYouthMappers支部
    extendedDescription: 私たちは、ケープコースト大学地理・地域計画学科で地理学を専攻する、または専攻しているすべての学生で構成される団体です。私たちの主な目的は、教室の内外で地理学への関心を高めることです。私たちのモットーは「私たちは地球とその住人を理解する」です。
  ym-University-of-Central-Florida:
    name: 地理空間情報学会
    description: セントラルフロリダ大学のYouthMappers支部
    extendedDescription: 私たちの使命は、GISの議論と応用に関心のあるあらゆる専攻の学生のために、社会的かつ教育的な環境を育成することです。年間を通して開催されるグループ活動や地域イベントでは、学生がボランティアとして地域社会に貢献できるよう組織され、地域密着型のGISプロジェクトを活用したり、地域の中学生や高校生にGISの利用と応用について教育したりしています。
  ym-University-of-Chicago:
    name: トブラー協会
    description: シカゴ大学のYouthMappers支部
  ym-University-of-Dar-es-Salaam:
    name: YouthMappers at ダルエスサラーム大学
    description: ダルエスサラーム大学のYouthMappers支部
    extendedDescription: "ダルエスサラーム大学YouthMappersの目的は、オープンソースデータとGIS技術を活用・促進し、潜在的な災害地域をマッピングし、緊急事態管理のためのリソースを提供し、メンバーをダルエスサラーム市内のオープンソースおよびGIS組織と繋げ、プロジェクトパートナーの今後のニーズに応えることです。"
  ym-University-of-Energy-and-Natural-Resources:
    name: エコクラブ
    description: エネルギー・天然資源大学のYouthMappers支部
    extendedDescription: 環境悪化に関する健全な教育をすべての市民に提供し、人類の生存のために環境のレクリエーションを最大限に活用すること。
  ym-University-of-Exeter:
    name: エクセター大学・英国赤十字社 Missing Maps
    description: エクセター大学のYouthMappers支部
    extendedDescription: "私たちは、GISに関する包括的な知識を持つ、熱心な地理学者のチームです。英国赤十字社による様々な人道支援活動を支援することに情熱を注いでいます。また、リモートセンシングデータのマッピングの重要性と、それが現場でどのように役立つかを教える重要な役割も担っています。私たちのマッパソンは、地理学科における様々なGIS研究に焦点を当てた学術的なテーマを設定するとともに、GISについて講演する講師を招いて、就職活動に役立つイベントとしても機能しています。"
  ym-University-of-Ghana:
    name: ガーナ大学 YouthMappers
    description: ガーナ大学のYouthMappers支部
    extendedDescription: "UG YouthMappersは、GISとリモートセンシングに関する知識とスキルを持つ大学院生と学部生で構成されています。このクラブは、地図作成を通して社会問題に取り組み、環境問題の緩和を目指す、意欲的なチームで構成されています。私たちの基本理念は、能力開発、権限委譲、そしてチームワークです。"
  ym-University-of-Liberia-YouthMappers:
    name: リベリア大学 YouthMappers
    description: リベリア大学のYouthMappers支部
    extendedDescription: "リベリア大学YouthMappersは、グローバルYouthMappersの支部組織です。私たちは、リベリアの発展と世界全体の発展のための地図作成に重点を置く、非営利の学生地図作成団体です。本組織の目的は、技術と地理空間知識を活用して地図を作成・開発し、地域および世界的な課題に対処するためのデータを収集・分析することです。私たちの目標は、学生が地図作成の分野への興味とスキルを伸ばせるよう支援し、機会を創出することです。私たちは、協力的で積極的であり、他者の生活を向上させるためにリベリア大学のYouthMappersと協力する意思のある、団結した学生コミュニティを思い描いています。"
  ym-University-of-Malawi:
    name: Chanco Malawi YouthMappers
    description: マラウイ大学のYouthMappers支部
    extendedDescription: "Chanco Malawi YouthMappersは、マラウイ大学チャンセラー・カレッジの学生地図作成団体です。この支部では、マラウイの開発と科学のニーズに応えるための地図作成に重点的に取り組んでいます。"
  ym-University-of-Maryland-College-Park:
    name: 地理クラブ
    description: メリーランド大学カレッジパーク校のYouthMappers支部
    extendedDescription: メリーランド大学カレッジパーク校の地理クラブの使命は、学生がキャンパス内および地域社会における地理的関心を探求するよう促し、奨励することです。
  ym-University-of-Mines-and-Technology:
    name: UMaT YouthMappers
    description: マインズ工科大学のYouthMappers支部
    extendedDescription: UMaT YouthMappersは、学生たちが地図作成の分野でスキルを向上させ、世界各地で地域特有の開発課題に取り組むためのオープンな地理データと分析を作成する機会を提供することを目指す、ボランティアの学生グループです。
  ym-University-of-Nairobi:
    name: 地理空間工学学生協会
    description: ナイロビ大学のYouthMappers支部
    extendedDescription: "ナイロビ大学の学生たちは、地元のOSMコミュニティであるMap KiberaやGrouthTruthと協力し、オープンマッピングについて学び、都市コミュニティのニーズに応えるためのデータを提供しています。"
  ym-University-of-Nigeria-Enugu-Campus:
    name: LionMappersTeam (LMT) エヌグ
    description: "ナイジェリア大学エヌグキャンパスのYouthMappers支部"
    extendedDescription: "LionMappersTeam（LMT）エヌグキャンパスは、YouthMappersネットワークの関連団体であり、メンバーに地理情報学の分野でスキルを学び向上させる機会を提供し、地域固有の課題を世界規模で解決するオープンな地理データと分析を作成することを唯一の目的としています。OpenStreetMap、市民科学、その他の地理空間技術を用いたクラウドソーシングによるマッピングと地理情報提供を行うボランティアチームであり、研究、トレーニング、そして地域社会の課題への対応に取り組んでいます。私たちは、ウェブ地図作成、GIS、リモートセンシングの応用と研究に携わっています。ボランティアによる地理情報、参加型GIS、市民科学に情熱を注いでいます。主な活動には、オンラインのクラウドソーシングによる地図作成、フィールドマッピング、トレーニングワークショップ、高校生へのアウトリーチ活動、そして人道支援活動が含まれます。"
  ym-University-of-Nigeria-Nsukka:
    name: LionMappersTeam (LMT) ヌスカ
    description: "ナイジェリア大学ヌスカ校のYouthMappers支部"
    extendedDescription: "LionMappersTeamはYouthMappersネットワークの関連団体であり、メンバーが地図作成科学の分野でスキルを学び向上させ、地域固有の課題を世界規模で解決するオープンな地理データと分析を作成する機会を提供することを唯一の目的としています。OpenStreetMap、市民科学、その他の地理空間技術を使用してクラウドソーシングによる地図作成と地理情報提供を行うボランティアチームであり、研究、トレーニング、そして地域社会の困難な課題への対応を行っています。私たちはGISとリモートセンシングの応用と研究に携わっています。参加型GISと市民科学、フィールドマッピング、トレーニングワークショップ、高校へのアウトリーチ活動を行っています。"
  ym-University-of-North-Texas:
    name: UNT 地理クラブ
    description: ノーステキサス大学のYouthMappers支部
    extendedDescription: "地理学クラブは、ノーステキサス大学の学生団体で、地理学に興味のあるすべての学生を歓迎します。地理学クラブの目的は、地理学、地理学科、そして地理学部への関心を高めるとともに、学生と教員間の親睦を深めることです。また、地理学研究に関する学生のニーズや要望を代弁し、大学コミュニティの利益となる革新的なアイデアを発表する場を提供することも目指しています。"
  ym-University-of-Northern-Colorado:
    name: UNCO地理学・GISクラブ
    description: ノーザンコロラド大学のYouthMappers支部
    extendedDescription: "ノーザンコロラド大学に所属する公式地理学・GISクラブ支部。私たちの目標は、学び、共有し、周囲の人々とつながることです。#MakingSenseOfTheWorld"
  ym-University-of-Port-Harcourt:
    name: UniqueMappersTeam (UMT) ポートハーコート
    description: ポートハーコート大学のYouthMappers支部
    extendedDescription: "UniqueMappersTeam (UMT) ポートハーコートは、ナイジェリアのニジェールデルタ地域やその他の地域で、回復力のあるコミュニティに人道的なマッピングサービスを提供するため、地理情報に関する地域固有の課題に対処するオープンな地理空間データと分析を作成するために、トレンドのマッピングスキルでメンバーをトレーニングして力を与えることを目的とした、共同オンラインマッピングの活動グループおよびボランティアチームです。私たちは、迅速対応マッピング、災害マッピング、地理情報マッピング、マップの更新、トレーニングのために、OpenStreetMap(OSM)プラットフォームやその他のアクセス可能なプラットフォームを使用して、クラウドソーシングマッピングと地理情報ボランティアを推進しています。これは、人道的OpenStreetMapチーム(HOT)の提携キャンパス支部です。これは、マッピングと地理情報の分野で世界的な機会を探求するために、メンバーが地理情報学のスキルを学び、向上させる機会を提供するYouthMappersのプロジェクトタスクチームです。"
  ym-University-of-Pretoria:
    name: 地理情報科学センター
    description: プレトリア大学のYouthMappers支部
    extendedDescription: "プレトリアの地図を作成する学生たちは、プレトリア大学の地理情報科学センターの支援を受けています。このセンターは、地理情報科学（GISc）の研究、教育・研修、専門能力開発、地域社会への貢献に携わるプレトリア大学の個人やチームの卓越性を、南アフリカ国内外での協力、教育・研修、提携を通じて奨励し、強化するためのプラットフォームです。"
  ym-University-of-Redlands:
    name: URSpatial Geo-Thinkers
    description: レッドランズ大学のYouthMappers支部
    extendedDescription: "メンバーのGISスキルとツールおよび手法に関する知識を、応用的な社会活動を通してさらに向上させるとともに、地域奉仕活動を通してキャンパスコミュニティにマッピングと空間分析の力について啓発します。"
  ym-University-of-Rwanda-Huye-Campus:
    name: ルワンダ YouthMappers
    description: ルワンダ大学フイキャンパスのYouthMappers支部
    extendedDescription: "マッピングの普及という理念と目的、そしてYouthMappersの公開講演から得た情報に基づき、地理学科の学生でマッピングに情熱を注ぐ者たちが集まり、キャンパス内に支部を設立しました。ファシリテーターであるガスパール・ルワニジリ博士（CGIS-ルワンダ所長）をはじめ、様々な講師陣の指導を受けています。"
  ym-University-of-South-Carolina:
    name: 地理学大学院生協会
    description: サウスカロライナ大学のYouthMappers支部
    extendedDescription: "GGSAは、地理学を専攻するすべての大学院生を支援するための組織であり、学科と学生間の連絡役を担うことで、学生主導で運営されています。私たちの目標は、地理学とその下位分野に関心を持つ大学院生の専門的、学術的、そして個人的な成長を促進することです。"
  ym-University-of-Southern-California:
    name: SC Mappers
    description: サウスカリフォルニア大学のYouthMappers支部
    extendedDescription: "私たちは世界を異なる視点で見ています。空間的なレンズを通して世界を捉えているのです。空間的思考の力によって、場所と空間を結びつけ、地球規模の課題解決に貢献します。ぜひ私たちと一緒に取り組みましょう！"
  ym-University-of-the-Philippines-Resilience-Institute:
    name: YouthMappers UPレジリエンス研究所
    description: フィリピン大学レジリエンス研究所のYouthMappers支部
    extendedDescription: "UPレジリエンス研究所は、学際的な研究とレジリエンスに向けた活動を通じて地域社会を強化することを使命として、2016年に設立されました。UP NOAHセンターおよび様々な団体の協力により、82州のうち17州の建物の災害リスクマップを作成し、400万件以上のフットプリントをOpenStreetMapにアップロードしました。"
  ym-University-of-the-Philippines-Resilience-Institute-twitter:
    name: YouthMappers UPレジリエンス研究所のTwitter
  ym-University-of-the-West-Indies-Mona-Campus:
    name: 図書館アウトリーチ - ODL
    description: "西インド諸島大学モナキャンパスのYouthMappers支部"
    extendedDescription: "UWIモナキャンパス図書館は、公共活動、アウトリーチ活動、特別プロジェクトに取り組んでいます。これにより、当図書館は空間リテラシーの促進役となり、ジャマイカおよびカリブ海地域の利益のために空間データの共有とアクセスを提唱する手段を得ることができます。災害救援とコミュニケーションのニーズ、そしてキャンパスと地域社会へのより良いサービス提供のために広範な地球科学と地質災害に関するニーズがあります。具体的には、すべての教職員と学生にそれらを紹介するための科学図書館があります。"
  ym-University-of-Victoria:
    name: 地理学学生協会
    description: ビクトリア大学のYouthMappers支部
    extendedDescription: "SOGSは、地理学科内における社会的および学術的利益を促進し、代表することを目指しています。これは、以下の4つの主要な目標によって表されます。地理学における教育の質とアクセス性に関する問題について議論する場を提供すること。学科会議や学科委員会への代表者派遣を通じて、学生の意見の合意を学科教員に伝える手段を提供すること。学生の利益となり、地理学における学生の関心分野に属すると考えられる活動の企画・運営を行うこと。UVSSおよびコースユニオンカウンシルを通じて、キャンパス内の他の学生団体との連絡役を務めること。"
  ym-University-of-Warwick:
    name: ウォーリック大学レジリエンス・マッピング協会
    description: ウォーリック大学のYouthMappers支部
    extendedDescription: 私たちはウォーリック大学を拠点とする、熱心な地図作成者のグループです。私たちの目標は、人々に人道支援地図作成への関心を高めてもらい、この活動が現場に与える影響を理解してもらうことです。私たちはMissing Mapsと国境なき医師団UKと密接に連携し、地図作成活動やワークショップでは緊急性の高い課題（HOTタスク）に焦点を当てています。私たちの地図作成イベントは、開催予定が決まり次第、Missing Mapsのページに掲載されます。
  ym-University-of-Wyoming:
    name: ガンマ・シータ・ウプシロン/地理クラブ
    description: ワイオミング大学のYouthMappers支部
  ym-University-of-Zimbabwe:
    name: UZMappers
    description: ジンバブエ大学のYouthMappers支部
    extendedDescription: UzMappersTeam ジンバブエは、オープンデータマッピングと人道災害対応マッピングにOpenStreetMapを使用するボランティアチームです。このチームは、メンバーにオープンソースの地理空間技術スキルを身につけさせています。
  ym-Vassar-College:
    name: Hudson Valley Mappers
    description: ヴァッサー大学のYouthMappers支部
    extendedDescription: "私たちの使命は、地域生態系、建築環境、そして地域社会の健康強化に重点を置いた地域マッピングプロジェクトに、同業者、教育者、地域団体が参加できる学際的なプラットフォームを提供することです。また、世界的な人道支援や開発活動への地理空間情報の提供にも貢献したいと考えています。"
  ym-Villanova-University:
    name: The Villanova Globeplotters
    description: ヴィラノバ大学のYouthMappers支部
    extendedDescription: "The Villanova Globeplottersは、ヴィラノバ大学のアウグスティヌス精神に基づく、世界社会への無私の奉仕という理念に基づいて設立されました。リラックスした交流を交えながら、参加学生の人種、専攻、所属する学生団体、大学でのキャリアレベルに関わらず、必要とする人々に地理空間情報を提供することを目指しています。"
  ym-West-Virginia-University:
    name: Maptime モーガンタウン
    description: ウェストバージニア大学のYouthMappers支部
    extendedDescription: "この共同設立支部は、協力的なチームとして活動し、国際開発、緊急対応、地理情報科学が交差するプロジェクトに取り組むことに関心のある人々に対し、オープンな学習環境を提供することに重点を置いています。有意義で有用な地理インフラデータの構築に関する技術研修と経験を提供することで、初心者から専門家までをつなぎ、世界中の姉妹都市との連携を促進しています。"
  ym-Western-Michigan-University:
    name: 地理クラブ
    description: ウェスタンミシガン大学のYouthMappers支部
  ym-Yarmouk-University:
    name: YouthMappers at YU
    description: ヤルムーク大学のユースマッパーズ支部
    extendedDescription: "ヤルムーク大学のYouthMappers支部は、中東・北アフリカ地域で初めて設立されたマッピンググループです。この地域では、難民、干ばつ、貧困といった危機が深刻化しており、こうした危機の影響を軽減するための人道的なマッピング活動が緊急に必要とされています。YU Mappersのメンバーは、オープンデータを活用してMENA地域の課題に取り組み、地域内の対象地域に救済と開発をもたらすことが奨励されています。"
