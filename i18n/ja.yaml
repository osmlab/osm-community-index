  Nottingham-OSM-pub-meetup:
    name: イースト・ミッドランズ（ノッティンガム）月例パブ交流会
    description: イースト・ミッドランズの地図作成者とユーザーのための交流会
    extendedDescription: "このグループは2011年3月から会合を開いており、当初はノッティンガムで、最近ではダービーで、そして時折イースト・ミッドランズ地方の他の場所でも会合を開いています。これらは社交的な集まりですが、地域や一般的なOSMに関する具体的な質問をするのに最適な場所です。夏の間は、通常、集合場所の周辺で1時間ほど簡単な地図作成作業を行います。グループ全体として、公共の通行権を地図化することに特別な関心を持っており、この目的のために定期的に地図作成会議を開催しています。"
  np-facebook:
    extendedDescription: "ネパールで地図を作成する？質問がありますか？このコミュニティと交流したいですか？ぜひ{url}にご参加ください。どなたでも大歓迎です！"
