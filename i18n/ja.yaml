    name: オープンソース・サンノゼ Discord
    description: "Discordで他のマッパーと交流しましょう！登録後、#\U0001F5FAopenstreetmap チャンネルに参加してください。"
  Open-Source-San-Jose-Mastodon:
    description: Mastodonでオープンソース・サンノゼをフォローしてください。
    extendedDescription: オープンソース・サンノゼは、ボランティアのプログラマーやデザイナーを市民テクノロジーを通じて地域社会のニーズと結びつける地元の非営利団体です。OSSJは、地元のボランティア地図作成コミュニティが隔週で開催するサウスベイ・マップ・ナイトを後援しています。
  Open-Source-San-Jose-Slack:
    name: オープンソース・サンノゼ Slack
    description: "どなたでも大歓迎です！ {signupUrl}で登録後、#proj-osm チャンネルにご参加ください。"
  OpenCleveland-meetup:
    name: オープン・クリーブランド
    description: クリーブランド地域のOpenStreetMapを改善する
    extendedDescription: "Open Geo クリーブランドは、特にOpenStreetMapをはじめとする無料の地理データセットや、地理データを管理・編集・表示するオープンソースの地理空間ソフトウェアの活用について、人々が議論し知識を共有できる場となることを目指しています。また、オハイオ州北東部におけるこれらのツールの普及を推進しています。私たちはMapTimeの支部でもあります =)"
  osgeo-oceania:
    name: OSGeo オセアニア
    description: 私たちはオセアニアにおけるOpenStreetMapコミュニティの発展を支援しています。
    extendedDescription: "OSGeo オセアニアの目的は、オセアニア地域におけるオープンな地理空間コミュニティを支援し、発展させることであり、FOSS4G SotM オセアニアカンファレンスシリーズの監督と運営もその一つです。"
