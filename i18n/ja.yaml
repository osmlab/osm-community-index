  GeoPhilly:
    name: GeoPhilly
    description: フィラデルフィア近郊の地図愛好家のためのミートアップ
    extendedDescription: "GeoPhillyは、地図と地図が語る物語への共通の愛を通して、開発者、地理学者、データオタク、オープンソース愛好家、市民ハッカー、地図マニアを結びつけます。仕事で地図を使っている方、あるいはもっと詳しく知りたい方は、ぜひこのミートアップにご参加ください！私たちのイベントは、オープンでフレンドリー、教育的かつ社交的な場となることを目指しており、ハッピーアワーからライトニングトーク、ワークショップまで、幅広い内容となっています。私たちと一緒に、フィラデルフィアで多様性に富み、刺激的な地理空間コミュニティを創り上げましょう！"
