en_NZ:
  al-maptime-tirana:
    description: Social events organised around mapping - beginners most welcome!
    extendedDescription: "Maptime is an open learning environment for all levels and degrees of knowledge, offering intentional educational support for the beginner. Maptime is simultaneously flexible and structured, creating space for mapping tutorials, workshops, ongoing projects with a shared goal and independent/collaborative work time."
  kosovo-flossk:
    extendedDescription: "Free Libre Open Source Software Kosova (FLOSSK) is a non-governmental organisation based in Prishtina established in 2009 in order to support, promote and develop free and open source software. Besides, we also contribute to open and participatory knowledge, education in information technologies through open courseware, and open standards, culture and open society using free communication."
  lu-github:
    description: GitHub Organisation for the OSM community in Luxembourg!
  map-kibera:
    description: Map Kibera is a registered organisation working in Kenya
    extendedDescription: Map Kibera Trust’s mission is to increase influence and representation of marginalised communities through the creative use of digital tools for action.
  maptime-bogota-facebook:
    extendedDescription: "Learn to collect data in the field and digitise onto OpenStreetMap. It is not necessary to have previous knowledge! You just need the desire to participate, learn and have fun."
